name: build

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# 같은 PR에 커밋을 연달아 올리면 앞선 빌드를 취소한다(ISE-274). 결과가 필요한 것은 마지막 커밋뿐이다.
# main·dev push는 취소하지 않는다. 머지마다 빌드 결과가 남아야 어느 머지에서 깨졌는지 안다.
# Note: 한 그룹에는 대기 실행이 하나만 남고 먼저 기다리던 실행은 cancel-in-progress가 false여도 취소된다(images.yml과 같은 이유).
#       그래서 push는 브랜치가 아니라 커밋(SHA)마다 그룹을 따로 둔다
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Note: build는 main·dev의 필수 검사다. 워크플로에 paths 필터를 걸면 frontend/만 바꾼 PR에서
      # 검사 결과가 보고되지 않아 머지가 막힌다. 그래서 워크플로는 항상 돌고, Java 단계만 건너뛴다.
      # 단계를 건너뛴 작업은 성공으로 보고된다.
      - name: 바뀐 영역 확인
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: script/ci-changed-areas.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Java 검사 건너뜀
        if: steps.changes.outputs.java != 'true'
        run: echo "frontend/ 안의 파일만 바뀌어 Java 검사를 건너뛴다. 프론트 검사는 frontend 워크플로가 한다."
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.java == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.changes.outputs.java == 'true'
      - name: Java 도구·포트 정책·인증 통합·기동 실패 전체 검사
        if: steps.changes.outputs.java == 'true'
        run: ./gradlew verifyWorkspace --no-daemon
      - name: 테스트 인프라 종료
        if: always() && steps.changes.outputs.java == 'true'
        run: docker compose -f compose.test.yml down
