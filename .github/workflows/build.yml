name: build

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Java 도구·포트 정책·인증 통합·기동 실패 전체 검사
        run: ./gradlew verifyWorkspace --no-daemon
      - name: 테스트 인프라 종료
        if: always()
        run: docker compose -f compose.test.yml down
