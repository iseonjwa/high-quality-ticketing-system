plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
	set('springCloudVersion', "2025.1.4")
}

allprojects {
	group = 'com.highquality'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {

	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencyManagement {
		imports {
			mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'

		testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}

configure(subprojects.findAll {it.name.endsWith('-service')}) {
	apply plugin: 'org.springframework.cloud'

	dependencies {
		implementation project(':common')
		testImplementation testFixtures(project(':common'))

		testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
		implementation 'org.springframework.boot:spring-boot-starter-webmvc'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-cloud-starter-netflix-eureka-client'

		runtimeOnly 'org.postgresql:postgresql'
		testRuntimeOnly 'com.h2database:h2'
	}
}


dependencies {
//	implementation 'org.springframework.boot:spring-boot-starter-security'

//	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
}

