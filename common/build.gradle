plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

description = 'common'

// 규칙
// 1. 웹 스택(webmvc·webflux), JPA, Kafka는 compileOnly로만 둔다. Gateway(WebFlux)도 이 모듈을 쓰므로
//    implementation·api로 올리면 Gateway 클래스패스에 MVC가 들어가 서블릿으로 뜬다.
// 2. 자동 구성(AutoConfiguration.imports)을 두지 않는다. 서비스가 scanBasePackages로 가져온다.
// 3. Kafka를 쓰는 코드(Outbox, processed_event, DLQ)는 넣지 않는다. 만들 때 common-messaging으로 분리한다.
dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
}
