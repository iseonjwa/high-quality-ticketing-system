# 서비스 공통 설정. 각 서비스가 spring.config.import: classpath:application-common.yaml 로 불러온다.
# 서비스마다 다른 값(DB 계정, 스키마)은 서비스의 application.yaml에서 db.* 로 넘긴다.
spring:
  config:
    import:
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${db.username}
    password: ${db.password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: ${db.schema}
