# 배포 서버(EC2)용 덮어쓰기 설정이다(ISE-174, docs/design/infra/deployment.md "배포 compose와 스크립트").
# 직접 쓰지 않고 script/deploy/deploy.sh <커밋 SHA>가 아래처럼 부른다.
#   IMAGE_TAG=<커밋 SHA> docker compose -f compose.yml -f compose.deploy.yml up -d --wait
#
# compose.yml과 달라지는 것
# - 앱 9개는 빌드하지 않고 GHCR의 그 커밋 이미지를 받는다(ISE-173). build를 지워 서버에서 실수로 빌드하지 않게 한다.
# - 컨테이너 상한과 힙은 SA 9-3 표(16GB급 EC2)를 따른다. 관측 추가분(loki·alloy·alertmanager)은 observability.md 4절 값이다.
# - 공개 진입점은 frontend(nginx) 443(https)이고 80은 https로 넘긴다(ISE-278, frontend/nginx/deploy.conf). gateway 8080은 호스트 모든
#   주소에 열지만 보안 그룹이 외부를 막고, 부하 측정 때만 발생기 보안 그룹에 연다(ADR 0046). Grafana는 nginx가 443의 /grafana/로
#   중계하고(누구나 보기), 관리 UI는 모두 127.0.0.1이라 SSH 터널로 본다.
# - 서버 주소는 서버 .env의 PUBLIC_URL 한 곳에만 둔다(Grafana root_url, 알림 템플릿).
# - 앱 8개의 JAVA_TOOL_OPTIONS에 -XX:+UseG1GC를 명시한다(ISE-193). 컨테이너 메모리가 약 1,792MB보다 작으면 JVM이 Serial GC를 고르는데,
#   팀원 측정(K1 등)은 모두 "배포 메모리 + G1" 조건이라 같게 맞춘다(reservation-service/k6/compose.g1.yml).
# - 앱 프로필은 prod다. 시연에서 traceId로 Zipkin 트레이스를 보려고 샘플링은 1.0으로 둔다(TRACING_SAMPLE_RATE).
# - 서버가 다시 켜지면 컨테이너도 다시 뜨게 하고(restart), 로그 파일이 디스크를 채우지 않게 크기를 묶는다(logging).
# - 알림·로그의 env 라벨은 deploy다(슬랙 제목에 "배포 서버").
#
# Note: !reset·!override는 Compose 2.24 이상이 필요하다. 서버는 Docker 공식 저장소의 compose 플러그인을 쓴다.

x-deploy-logging: &deploy-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-deploy-app-env: &deploy-app-env
  SPRING_PROFILES_ACTIVE: prod
  TRACING_SAMPLE_RATE: "1.0"

services:
  config-server:
    image: ghcr.io/iseonjwa/config-server:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseG1GC
  eureka:
    image: ghcr.io/iseonjwa/eureka:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseG1GC
  gateway:
    image: ghcr.io/iseonjwa/gateway:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    # 힙 512MB + 비힙 약 158MB + JVM 지표 밖 약 130MB ≈ 800MB(계산값)라 768MiB에서 OOM이 세 번 났다(배포 서버 5차).
    # 1,024MiB와 직접 메모리 상한 128MB로 같은 조건(활성 VU 5,849)을 다시 돌려 OOM 0, 메모리 최대 785MiB였다(M1).
    # 컨테이너 상한 합은 12,672 → 12,928MiB로 장비(약 15.7GiB) 안이다. 직접 메모리 상한은 넘칠 때 컨테이너 강제 종료 대신 요청 단위 오류가 나게 한다
    mem_limit: 1024m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -XX:MaxDirectMemorySize=128m -XX:+UseG1GC
    ports: !override ["8080:8080"]
  # nginx 설정은 배포용(frontend/nginx/deploy.conf)으로 바꿔 끼운다(ISE-278). 바깥 요청은 443(https)으로 받고 80은 https로 넘긴다.
  # /var/www/certbot은 서버의 certbot이 인증서 확인 파일을 쓰는 폴더다. 인증서는 /etc/letsencrypt의 live/와 archive/만 넣는다
  # (live/의 상대 링크가 archive/를 가리킨다. ACME 계정 키가 든 accounts/ 등은 nginx 컨테이너에 넣지 않는다).
  # 이미지 태그가 커밋마다 바뀌어 배포 때마다 컨테이너를 다시 만들므로, 마운트한 설정도 그때 새 파일로 읽힌다.
  frontend:
    image: ghcr.io/iseonjwa/frontend:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    restart: unless-stopped
    logging: *deploy-logging
    ports: !override ["80:80", "443:443"]
    volumes:
      - ./frontend/nginx/deploy.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
  user-service:
    image: ghcr.io/iseonjwa/user-service:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 640m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms192m -Xmx384m -XX:+UseG1GC
  reservation-service:
    image: ghcr.io/iseonjwa/reservation-service:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 1152m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms384m -Xmx768m -XX:+UseG1GC
  payment-service:
    image: ghcr.io/iseonjwa/payment-service:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    # 768MiB에서 2026-11-15 UTC 하루에 cgroup OOM(exit 137)으로 다섯 번 죽었다(ISE-264, TS-71). 실측은 비힙 committed 약 193~216MB
    # (Metaspace 134MB, 코드 캐시 41MB) + JVM 지표 밖 약 144MB(스레드 스택, GC 자료구조, malloc)라 힙이 512MB까지 커지면 약 870MB다.
    # 대사 회차(5분마다 housekeeping-1)가 힙을 키우는 순간 상한을 넘었다. 힙은 그대로 두고 상한을 1,024MiB로 올린다(gateway와 같은 방식).
    # 힙 밖 상한(Metaspace 256MB, 코드 캐시 128MB, 직접 메모리 64MB)은 실측의 약 2~3배로, 누수가 생기면 컨테이너 강제 종료 대신 JVM 오류로 보이게 한다.
    # 컨테이너 상한 합은 12,992 → 13,248MiB(frontend 포함, compose config 계산)로 장비(약 15.7GiB, 15,701MiB)의 84%다
    mem_limit: 1024m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=64m -XX:+UseG1GC
  mock-pg:
    image: ghcr.io/iseonjwa/mock-pg:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      # Note: Mock PG는 외부 PG를 흉내 내는 시연·측정 도구라 prod가 아니라 loadtest로 띄운다. 그래야 장애 주입·원장 조회 API가
      # 열린다(ISE-71). 밖에서는 Gateway의 운영자 경로(/api/v1/admin/demo/pg/faults·ledger/summary, ADMIN만)로만 닿는다(ISE-134).
      SPRING_PROFILES_ACTIVE: loadtest
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseG1GC
  # 내부 AI 상담(ISE-126). DB·Kafka 없이 Claude API만 외부로 부른다. 키가 비면 검색 모드로 답한다
  assistant-service:
    image: ghcr.io/iseonjwa/assistant-service:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 384m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx192m -XX:+UseG1GC

  postgres-user:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
  postgres-reservation:
    mem_limit: 1024m
    restart: unless-stopped
    logging: *deploy-logging
  postgres-payment:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
  redis:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    command: !override [redis-server, --appendonly, "yes", --maxmemory, 400mb, --maxmemory-policy, noeviction]
  kafka:
    mem_limit: 1536m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
  kafka-ui:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      JAVA_OPTS: -Xmx256m
      # 배포 서버의 Kafka-UI에서는 메시지 발행·토픽 변경을 막는다(ISE-72). 위조 이벤트로 환불을 일으키는 경로를 닫는다.
      KAFKA_CLUSTERS_0_READONLY: "true"

  # 관측 도구 다섯은 설정 파일의 해시를 라벨로 단다(deploy.sh가 CONFIG_HASH_*를 넘긴다). 파일 하나를 마운트한 설정은
  # git checkout으로 바뀌어도 컨테이너가 옛 파일을 계속 보고, `up -d`는 설정 내용만 바뀐 컨테이너를 다시 만들지 않는다.
  # 라벨이 바뀌면 `up -d`가 그 컨테이너를 다시 만든다(TS-64). 값이 비면(직접 compose를 부를 때) 빈 라벨이다.
  prometheus:
    mem_limit: 768m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      STACK_ENV: deploy
    labels:
      iseonjwa.config-hash: "${CONFIG_HASH_PROMETHEUS:-}"
  alertmanager:
    mem_limit: 128m
    restart: unless-stopped
    logging: *deploy-logging
    labels:
      iseonjwa.config-hash: "${CONFIG_HASH_ALERTMANAGER:-}"
      # 알림 템플릿의 Grafana 주소가 바뀌면 다시 만든다. configs(grafana-url-template)의 내용만 바뀌면 compose가 컨테이너를
      # 다시 만들지 않아 옛 주소 템플릿을 계속 읽는다(2026-11-16 로컬에서 확인). 아래 configs의 주소 식을 고치면 이 값도 같이 고친다.
      iseonjwa.grafana-url: "${PUBLIC_URL:-}/grafana"
  # Grafana는 프론트 nginx가 https://<공개 주소>/grafana/로 중계하고, 누구나 보기(익명 Viewer)만 된다(ISE-278).
  # 시연·외부 심사 때 심사위원이 직접 보게 하려는 것이다(판단 기록 2026-11-16-grafana-public-over-https-path.md).
  # 3000은 로컬처럼 127.0.0.1에만 연다(SSH 터널이면 http://localhost:3000/grafana/). 시연 모드(?demo=on)의 traceId 링크도 /grafana/로 온다.
  # 공개 주소는 서버 .env의 PUBLIC_URL 한 곳에만 둔다. Grafana가 넘김·링크를 만들 때 쓰는 root_url이 이 값에서 나온다.
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: "${PUBLIC_URL:?서버 .env에 공개 주소를 PUBLIC_URL로 둔다(예 https://서버IP)}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # 로그인 쿠키를 https에서만 보낸다. HSTS가 없어 http 주소로 한 번 들어오면 넘기기 전에 쿠키가 평문으로 갈 수 있어서다.
      # 그래서 SSH 터널(http://localhost:3000/grafana/)로는 관리자 로그인이 되지 않는다. 로그인은 https 주소에서 한다.
      GF_SECURITY_COOKIE_SECURE: "true"
    mem_limit: 384m
    restart: unless-stopped
    logging: *deploy-logging
    labels:
      iseonjwa.config-hash: "${CONFIG_HASH_GRAFANA:-}"
  loki:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    labels:
      iseonjwa.config-hash: "${CONFIG_HASH_LOKI:-}"
  alloy:
    mem_limit: 256m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      STACK_ENV: deploy
    labels:
      iseonjwa.config-hash: "${CONFIG_HASH_ALLOY:-}"
  zipkin:
    mem_limit: 768m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      JAVA_OPTS: -Xmx384m
      # Note: 메모리 저장은 기본 50만 건까지 쌓는다. 샘플링 1.0과 측정 몰림 뒤 힙(384m)이 차서 unhealthy가 되면
      # 배포의 compose --wait가 실패해 되돌림까지 막는다(TS-54). 10만 건으로 줄여 힙 안에 머물게 한다(건당 크기는 추정).
      MEM_MAX_SPANS: 100000

configs:
  # 슬랙 알림의 Grafana 바로 가기(compose.yml grafana-url-template). 배포 서버는 공개 주소의 /grafana다.
  # 주소 식을 고치면 alertmanager의 iseonjwa.grafana-url 라벨도 같이 고친다(그래야 컨테이너가 다시 만들어진다).
  grafana-url-template:
    content: '{{ define "iseonjwa.grafana_url" }}${PUBLIC_URL:?서버 .env에 공개 주소를 PUBLIC_URL로 둔다(예 https://서버IP)}/grafana{{ end }}'
