# 배포 서버(EC2)용 덮어쓰기 설정이다(ISE-174, docs/design/infra/deployment.md "배포 compose와 스크립트").
# 직접 쓰지 않고 script/deploy/deploy.sh <커밋 SHA>가 아래처럼 부른다.
#   IMAGE_TAG=<커밋 SHA> docker compose -f compose.yml -f compose.deploy.yml up -d --wait
#
# compose.yml과 달라지는 것
# - 앱 9개는 빌드하지 않고 GHCR의 그 커밋 이미지를 받는다(ISE-173). build를 지워 서버에서 실수로 빌드하지 않게 한다.
# - 컨테이너 상한과 힙은 SA 9-3 표(16GB급 EC2)를 따른다. 관측 추가분(loki·alloy·alertmanager)은 observability.md 4절 값이다.
# - 공개 진입점은 frontend(nginx) 80이다. gateway 8080은 호스트 모든 주소에 열지만 보안 그룹이 외부를 막고,
#   부하 측정 때만 발생기 보안 그룹에 연다(ADR 0046). Grafana만 3000으로 열고(보안 그룹이 팀원 IP만 허용, 익명 보기),
#   나머지 관리 UI는 127.0.0.1이라 SSH 터널로 본다.
# - 앱 8개의 JAVA_TOOL_OPTIONS에 -XX:+UseG1GC를 명시한다(ISE-193). 컨테이너 메모리가 약 1,792MB보다 작으면 JVM이 Serial GC를 고르는데,
#   팀원 측정(K1 등)은 모두 "배포 메모리 + G1" 조건이라 같게 맞춘다(reservation-service/k6/compose.g1.yml).
# - 앱 프로필은 prod다. 시연에서 traceId로 Zipkin 트레이스를 보려고 샘플링은 1.0으로 둔다(TRACING_SAMPLE_RATE).
# - 서버가 다시 켜지면 컨테이너도 다시 뜨게 하고(restart), 로그 파일이 디스크를 채우지 않게 크기를 묶는다(logging).
# - 알림·로그의 env 라벨은 deploy다(슬랙 제목에 "배포 서버").
#
# Note: !reset·!override는 Compose 2.24 이상이 필요하다. 서버는 Docker 공식 저장소의 compose 플러그인을 쓴다.

x-deploy-logging: &deploy-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-deploy-app-env: &deploy-app-env
  SPRING_PROFILES_ACTIVE: prod
  TRACING_SAMPLE_RATE: "1.0"

services:
  config-server:
    image: ghcr.io/iseonjwa/config-server:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseG1GC
  eureka:
    image: ghcr.io/iseonjwa/eureka:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseG1GC
  gateway:
    image: ghcr.io/iseonjwa/gateway:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    # 힙 512MB + 비힙 약 158MB + JVM 지표 밖 약 130MB ≈ 800MB(계산값)라 768MiB에서 OOM이 세 번 났다(배포 서버 5차).
    # 1,024MiB와 직접 메모리 상한 128MB로 같은 조건(활성 VU 5,849)을 다시 돌려 OOM 0, 메모리 최대 785MiB였다(M1).
    # 컨테이너 상한 합은 12,672 → 12,928MiB로 장비(약 15.7GiB) 안이다. 직접 메모리 상한은 넘칠 때 컨테이너 강제 종료 대신 요청 단위 오류가 나게 한다
    mem_limit: 1024m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -XX:MaxDirectMemorySize=128m -XX:+UseG1GC
    ports: !override ["8080:8080"]
  frontend:
    image: ghcr.io/iseonjwa/frontend:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    restart: unless-stopped
    logging: *deploy-logging
    ports: !override ["80:80"]
  user-service:
    image: ghcr.io/iseonjwa/user-service:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 640m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms192m -Xmx384m -XX:+UseG1GC
  reservation-service:
    image: ghcr.io/iseonjwa/reservation-service:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 1152m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms384m -Xmx768m -XX:+UseG1GC
  payment-service:
    image: ghcr.io/iseonjwa/payment-service:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 768m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -XX:+UseG1GC
  mock-pg:
    image: ghcr.io/iseonjwa/mock-pg:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      # Note: Mock PG는 외부 PG를 흉내 내는 시연·측정 도구라 prod가 아니라 loadtest로 띄운다. 그래야 장애 주입·원장 조회 API가
      # 열린다(ISE-71). 밖에서는 Gateway의 운영자 경로(/api/v1/admin/demo/pg/faults·ledger/summary, ADMIN만)로만 닿는다(ISE-134).
      SPRING_PROFILES_ACTIVE: loadtest
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseG1GC
  # 내부 AI 상담(ISE-126). DB·Kafka 없이 Claude API만 외부로 부른다. 키가 비면 검색 모드로 답한다
  assistant-service:
    image: ghcr.io/iseonjwa/assistant-service:${IMAGE_TAG:?배포할 40자 커밋 SHA를 IMAGE_TAG로 넘긴다}
    build: !reset null
    mem_limit: 384m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      <<: *deploy-app-env
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx192m -XX:+UseG1GC

  postgres-user:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
  postgres-reservation:
    mem_limit: 1024m
    restart: unless-stopped
    logging: *deploy-logging
  postgres-payment:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
  redis:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    command: !override [redis-server, --appendonly, "yes", --maxmemory, 400mb, --maxmemory-policy, noeviction]
  kafka:
    mem_limit: 1536m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
  kafka-ui:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      JAVA_OPTS: -Xmx256m
      # 배포 서버의 Kafka-UI에서는 메시지 발행·토픽 변경을 막는다(ISE-72). 위조 이벤트로 환불을 일으키는 경로를 닫는다.
      KAFKA_CLUSTERS_0_READONLY: "true"

  prometheus:
    mem_limit: 768m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      STACK_ENV: deploy
  alertmanager:
    mem_limit: 128m
    restart: unless-stopped
    logging: *deploy-logging
  # Grafana만 호스트 모든 주소의 3000에 연다. 보안 그룹이 팀원 IP만 허용한다(deployment.md 3절).
  # 익명은 보기(Viewer)만 된다. 시연 모드(?demo=on)의 traceId 링크가 이 주소(<서버 IP>:3000)로 온다.
  grafana:
    ports: !override ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    mem_limit: 384m
    restart: unless-stopped
    logging: *deploy-logging
  loki:
    mem_limit: 512m
    restart: unless-stopped
    logging: *deploy-logging
  alloy:
    mem_limit: 256m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      STACK_ENV: deploy
  zipkin:
    mem_limit: 768m
    restart: unless-stopped
    logging: *deploy-logging
    environment:
      JAVA_OPTS: -Xmx384m
      # Note: 메모리 저장은 기본 50만 건까지 쌓는다. 샘플링 1.0과 측정 몰림 뒤 힙(384m)이 차서 unhealthy가 되면
      # 배포의 compose --wait가 실패해 되돌림까지 막는다(TS-54). 10만 건으로 줄여 힙 안에 머물게 한다(건당 크기는 추정).
      MEM_MAX_SPANS: 100000
