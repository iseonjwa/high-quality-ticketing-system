# 로컬 개발 전용. docker compose가 compose.yaml과 함께 자동으로 읽는다.
# IntelliJ로 띄운 앱이 인프라에 붙을 수 있게 포트를 127.0.0.1(이 PC)에만 연다.
# 배포(EC2)에서는 이 파일 없이 compose.yaml만 쓴다: docker compose -f compose.yaml ... (SA 9-2)
#
# IntelliJ 앱에서 접속할 주소
#   config-server  localhost:8888
#   postgres       user localhost:5433 · reservation localhost:5434 · payment localhost:5435
#   redis          localhost:6379
#   kafka          localhost:29092

services:
  config-server:
    ports:
      - "127.0.0.1:8888:8888"

  postgres-user:
    ports:
      - "127.0.0.1:5433:5432"

  postgres-reservation:
    ports:
      - "127.0.0.1:5434:5432"

  postgres-payment:
    ports:
      - "127.0.0.1:5435:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  kafka:
    ports:
      - "127.0.0.1:29092:29092"
