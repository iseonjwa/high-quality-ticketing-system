# IntelliJ로 띄운 서비스가 compose 인프라에 붙는다. 포트는 compose.override.yaml이 127.0.0.1에 연다
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  kafka:
    bootstrap-servers: localhost:9092

management:
  tracing:
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
