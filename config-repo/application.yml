management:
  metrics:
    tags:
      application: ${spring.application.name}
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
spring:
  jackson:
    default-property-inclusion: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 1s
  reactor:
    context-propagation: auto
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.uuid}
iseonjwa:
  request-log:
    # 요청 한 줄(메서드·경로·상태·시간, ISE-182)을 남기는 필터. false면 등록하지 않는다(부하 측정 때 로그 양 조절).
    enabled: true
    # 운영은 굿풋에서 빠진 요청(5xx, 클라이언트가 끊은 요청, 200ms 이상)만 남긴다(ADR 0052). Gateway와 서블릿 서비스가 같이 읽는다.
    # 배포 서버 7차 H2에서 Gateway 요청 로그를 끄자 서버 CPU가 1,000/s 78% → 66%로 내려갔다. 비용 대부분이 JVM 밖 로그 경로
    # (표준 출력 → Docker → Alloy → Loki)라 줄 수를 줄인다. 정상 요청은 Zipkin 트레이스와 http_server_requests 지표로 본다.
    # 로컬은 application-local.yml이 all로 되돌린다. 4xx까지 보려면 min-status를 400으로 내린다
    mode: problems
    min-status: 500
    slow-threshold: 200ms
