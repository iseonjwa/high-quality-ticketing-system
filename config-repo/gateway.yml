server:
  port: 8080
spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
          # 한 요청에 두 라우트가 맞으면 먼저 선언한 것이 선택된다. /admin/demo/pg/**와 /admin/users/**는 reservation의 /admin/**보다 앞에 둔다.
          routes:
            # 시연 장애 패널(ISE-134): 운영자가 화면에서 Mock PG 장애 주입·원장 요약을 부른다. /api/v1/admin/**라 ADMIN만 닿는다.
            # 장애 설정과 원장 요약만 연다(reset·결제 API는 열지 않는다). Mock PG가 local 프로필이면 이 API가 없어 404다.
            # reservation의 /admin/**보다 먼저 맞아야 하므로 맨 앞에 둔다
            - id: mock-pg-demo
              uri: lb://mock-pg
              predicates:
                - Path=/api/v1/admin/demo/pg/faults,/api/v1/admin/demo/pg/ledger/summary
              filters:
                - RewritePath=/api/v1/admin/demo/pg/(?<segment>.*), /mock-pg/$\{segment}
                # Mock PG는 인증을 보지 않는다. 사용자 토큰을 넘기지 않는다
                - RemoveRequestHeader=Authorization
            - id: user
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/auth/**,/api/v1/admin/users/**
            - id: reservation
              uri: lb://reservation-service
              predicates:
                - Path=/api/v1/concerts/**,/api/v1/schedules/**,/api/v1/reservations/**,/api/v1/lotteries/**,/api/v1/admin/**
            - id: payment
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
            # 내부 AI 상담(ISE-126). LLM 답변은 전역 3초(SA 9-4)를 넘길 수 있어 이 라우트만 응답 시한 10초다(ADR 0049).
            # 서비스 쪽 Claude 시한(8초)보다 길게 둬서, 시한 초과는 Gateway가 아니라 서비스가 검색 모드로 답한다
            - id: assistant
              uri: lb://assistant-service
              predicates:
                - Path=/api/v1/assistant/**
              metadata:
                response-timeout: 10000
                connect-timeout: 1000
          observability:
            enabled: true
          metrics:
            enabled: true
  # Gateway의 Lettuce 명령 시한. 공통 application.yml의 100ms를 Gateway만 늘린다. 인증 필터 시한(auth.redis-timeout)보다 커야
  # 필터 시한이 먼저 걸려 원인이 lookup_timeout으로 남는다(ADR 0050)
  data:
    redis:
      timeout: 300ms
auth:
  access-secret: ${JWT_ACCESS_SECRET}
  issuer: iseonjwa-auth
  # 블랙리스트 조회를 기다리는 시한. 느린 호출 기준(100ms)보다 커야 "느리지만 응답함"과 "응답 없음"이 나뉜다(ADR 0050)
  redis-timeout: 200ms
entry-token:
  # 입장 토큰 검증 키. 발급하는 reservation-service와 같은 키다. 환경변수로만 주입한다(docs/design/queue/contracts.md 1절)
  secret: ${ENTRY_TOKEN_SECRET}
# auth-redis 값은 2026-11-10 배포 측정(Q1 G 설정, G1 재측정 2회)으로 정했다(ADR 0050). 차단기는 Redis 장애(시한 초과·연결 오류)만 세고,
# 자기 과부하는 bulkhead가 거절한다. 거절 비율은 차단기 대신 경보(GatewayAuthRedisBulkheadRejecting)로 본다.
resilience4j:
  circuitbreaker:
    instances:
      auth-redis:
        sliding-window-type: TIME_BASED
        # 시간 창이라 단위는 초다. 건수 창 20은 초당 1,000건에서 0.02초라 순간 지연에 흔들렸다
        sliding-window-size: 10
        minimum-number-of-calls: 500
        failure-rate-threshold: 50
        slow-call-duration-threshold: 100ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 20
        # bulkhead 거절을 실패로 세면 과부하가 곧 "Redis 장애"가 되어 인증 전체가 열림 시간 동안 503이 된다
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      auth-redis:
        # 초당 1,000건 × 정상으로 볼 한 건 50ms(리틀의 법칙, 계산값). 넘친 호출은 기다리지 않고 바로 503이다
        max-concurrent-calls: 50
        max-wait-duration: 0
