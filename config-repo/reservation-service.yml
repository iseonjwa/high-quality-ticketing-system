server:
  port: 8082
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/reservation}
    username: ${DB_USER:iseonjwa}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  kafka:
    consumer:
      group-id: reservation-service.bootstrap
payment:
  token:
    # 결제 토큰 발급 키. 키는 환경변수로만 주입하고 저장소에는 이름만 둔다(ADR 0025)
    secret: ${PAYMENT_TOKEN_SECRET:}
