server:
  port: 8082
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/reservation}
    username: ${DB_USER:iseonjwa}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # Note: 커넥션을 1초 안에 못 받으면 실패시킨다(ISE-196). 기본값 30초는 Gateway 응답 시한(3초)보다 길어,
      # Gateway가 이미 포기한 요청을 서버가 끝까지 기다리다 처리해 부하가 끝난 뒤에도 회복하지 못했다(k6-overload-recovery.md R1)
      connection-timeout: 1000
  kafka:
    producer:
      properties:
        # Note: Outbox 릴레이가 브로커 확인을 기다리는 시간의 기준이다(payment-service와 같은 값).
        # max.block.ms + delivery.timeout.ms가 전송 시한(send-timeout) 안에 들어오지 않으면 기동이 실패한다
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 2000
        linger.ms: 0
    consumer:
      group-id: reservation-service.bootstrap
messaging:
  outbox:
    # 임대는 전송 시한(send-timeout)의 2배 이상이어야 한다. 어긋나면 기동이 실패한다
    batch-size: 20
    lease: 30s
    send-timeout: 12s
seat-hold:
  # sync(동기형 선점 201, 기본) 또는 async(접수형 202). 기동할 때 한 번 읽으므로 바꾸려면 재시작한다(ADR 0057)
  mode: sync
queue:
  admit-per-second: 50
  entry-token-ttl: 10m
  poll-min: 3s
  poll-max: 10s
  poll-jitter-ratio: 0.2
  admission-enabled: true
  admission-interval: 500ms
  cleanup-limit: 500
  schedule-cache-refresh: 30s
  schedule-cache-look-ahead: 1h
  key-retention-after-start: 1h
  redis:
    # 대기열 Redis 차단기 설정
    circuit-breaker:
      sliding-window-size: 10
      minimum-number-of-calls: 500
      failure-rate-threshold: 50
      slow-call-duration-threshold: 100ms
      slow-call-rate-threshold: 80
      wait-duration-in-open-state: 5s
      permitted-number-of-calls-in-half-open-state: 20
entry-token:
  # 입장 토큰 발급 키. 키는 환경변수로만 주입하고 저장소에는 이름만 둔다(docs/design/queue/contracts.md 1절)
  secret: ${ENTRY_TOKEN_SECRET:}
payment:
  token:
    # 결제 토큰 서명 개인키(ES256, PKCS#8 DER의 Base64 한 줄). 환경변수로만 주입하고 저장소에는 이름만 둔다(ADR 0055)
    private-key: ${PAYMENT_TOKEN_PRIVATE_KEY:}
observability:
  scheduler-redis-spans:
    # 예약 작업 바로 아래 Redis 명령 스팬을 Zipkin으로 보낼지 정한다. 평시 스팬의 약 87%라 기본은 보내지 않는다(TS-54).
    # 스케줄러 실행 안의 느린 호출을 파고들 때만 true로 켜고 서비스를 다시 띄운다. lettuce_* 지표는 이 값과 상관없이 남는다
    export: false
