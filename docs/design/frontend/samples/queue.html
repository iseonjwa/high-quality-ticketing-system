<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이선좌 · 대기열 (디자인 시스템 샘플)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 1. 토큰: docs/design/frontend/design-system.md 2절과 같은 값이다(seat-selection.html과 같다) ── */
:root {
  --gray-0:#FFFFFF; --gray-25:#FBFBFD; --gray-50:#F4F5F8; --gray-100:#E9EBF0; --gray-200:#D7DAE2;
  --gray-300:#B9BDC9; --gray-400:#8D92A3; --gray-500:#676C7E; --gray-700:#373B4A; --gray-800:#232631; --gray-900:#14161E;
  --primary-50:#EEF0FF; --primary-100:#DDE1FF; --primary-500:#5B5BF0; --primary-600:#3B3BD4; --primary-700:#2F2FAE;
  --success-50:#E8F6EE; --success-600:#1E7F4F;
  --warning-50:#FFF4E5; --warning-500:#F59F00; --warning-700:#9A5200;
  --danger-50:#FDECEE; --danger-600:#D12B3A;
  --info-50:#EAF2FD; --info-600:#1F6FD1;
  --seat-vip:#C2255C;

  --bg-page:var(--gray-25); --bg-surface:var(--gray-0); --bg-subtle:var(--gray-50);
  --text-strong:var(--gray-900); --text-default:var(--gray-700); --text-muted:var(--gray-500); --text-disabled:var(--gray-400);
  --border-default:var(--gray-100); --border-strong:var(--gray-200);
  --focus-ring:var(--primary-600);
  --font-sans:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(20,22,30,.06); --shadow-md:0 4px 12px rgba(20,22,30,.08);
  --dur-fast:120ms; --dur-base:200ms; --ease-out:cubic-bezier(.2,.8,.2,1);
}

/* ── 2. 기본 ── */
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:var(--font-sans); background:var(--bg-page); color:var(--text-default); font-size:16px; line-height:24px; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere; }
h1,h2,p { margin:0; }
button { font:inherit; }
.num { font-variant-numeric:tabular-nums; }
.t-display { font-size:32px; line-height:40px; font-weight:700; color:var(--text-strong); letter-spacing:-0.01em; }
.t-title   { font-size:24px; line-height:32px; font-weight:700; color:var(--text-strong); letter-spacing:-0.01em; }
.t-heading { font-size:18px; line-height:26px; font-weight:600; color:var(--text-strong); }
.t-body-sm { font-size:14px; line-height:20px; }
.t-caption { font-size:12px; line-height:16px; font-weight:500; }
.muted { color:var(--text-muted); }
:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

/* ── 3. 컴포넌트(디자인 시스템 그대로) ── */
.card { background:var(--bg-surface); border:1px solid var(--border-default); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); height:44px; padding:0 var(--space-5);
  border-radius:var(--radius-md); border:1px solid transparent; font-weight:600; font-size:15px; cursor:pointer; text-decoration:none;
  transition:background var(--dur-fast) var(--ease-out); }
.btn-lg { height:52px; font-size:16px; }
.btn-block { width:100%; }
.btn-primary { background:var(--primary-600); color:#fff; }
.btn-primary:hover { background:var(--primary-700); }
.btn-outline { background:var(--bg-surface); color:var(--text-default); border-color:var(--border-strong); }
.btn-outline:hover { background:var(--bg-subtle); }
.btn-ghost { background:transparent; color:var(--text-default); }
.btn-ghost:hover { background:var(--bg-subtle); }
.spinner { width:18px; height:18px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex:none; }
@keyframes spin { to { transform:rotate(360deg); } }


/* ── 4. 레이아웃: 실제 AppLayout 헤더와 같다. 예매 단계는 예매 흐름 화면에서만 헤더 가운데에 둔다 ── */
.topbar { background:var(--bg-surface); border-bottom:1px solid var(--border-default); position:sticky; top:0; z-index:10; }
.topbar-inner { max-width:1200px; margin:0 auto; height:64px; padding:0 var(--space-6); display:flex; align-items:center; gap:var(--space-6); }
.brand { display:inline-flex; align-items:center; gap:var(--space-2); font-weight:800; font-size:20px; color:var(--text-strong); text-decoration:none; letter-spacing:-0.02em; flex:none; }
.brand-mark { width:24px; height:24px; border-radius:7px 7px 4px 4px; background:var(--primary-600); position:relative; }
.brand-mark::after { content:""; position:absolute; left:5px; right:5px; bottom:5px; height:5px; border-radius:2px; background:#fff; }
.steps { list-style:none; margin:0 auto; padding:0; display:flex; gap:var(--space-2); align-items:center; }
.step { display:flex; align-items:center; gap:var(--space-2); font-size:14px; color:var(--text-muted); white-space:nowrap; }
.step + .step::before { content:""; width:24px; height:1px; background:var(--border-strong); margin-right:var(--space-2); }
.step-dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--bg-subtle); color:var(--text-muted); }
.step.current { color:var(--text-strong); font-weight:600; }
.step.current .step-dot { background:var(--primary-600); color:#fff; }
.menu { display:flex; gap:var(--space-1); flex:none; }
.menu .btn { height:40px; padding:0 var(--space-4); font-size:14px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
/* 앱 화면이 좁으면 현재 단계 이름만 남기고, 휴대폰 폭에서는 단계를 숨긴다(이름은 화면 낭독기에 남는다) */
@media (max-width: 960px) { .step:not(.current) .step-label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); } .step + .step::before { width:12px; } }
@media (max-width: 640px) {
  .steps { display:none; }
  .topbar-inner { padding:0 var(--space-4); justify-content:space-between; }
  .menu .btn { padding:0 var(--space-3); }
}

.page { max-width:1200px; margin:0 auto; padding:var(--space-10) var(--space-6); }
@media (max-width: 640px) { .page { padding:var(--space-6) var(--space-4); } }

/* ── 5. 대기열 화면 ── */
.queue { max-width:560px; margin:0 auto; display:grid; gap:var(--space-4); }
.concert-line { display:flex; align-items:center; gap:var(--space-3); padding:0 var(--space-1); }
.poster { width:40px; height:52px; border-radius:var(--radius-sm); background:linear-gradient(150deg, var(--primary-700), var(--seat-vip)); flex:none; }
.concert-line .t-body-sm { margin-top:2px; }

.queue-card { padding:var(--space-8); display:grid; gap:var(--space-6); text-align:center; }
@media (max-width: 640px) { .queue-card { padding:var(--space-6) var(--space-5); } }

/* 상태 줄: 지금 무엇을 하고 있는지(자동 확인 중, 다시 연결 중) */
.live { display:inline-flex; align-items:center; justify-self:center; gap:var(--space-2); min-height:28px; padding:4px var(--space-3); line-height:20px; text-align:left; border-radius:var(--radius-pill); background:var(--bg-subtle); font-size:13px; color:var(--text-muted); }
.live .dot { width:8px; height:8px; flex:none; border-radius:50%; background:var(--success-600); animation:pulse 1.6s ease-in-out infinite; }
.live.is-warning { background:var(--warning-50); color:var(--warning-700); }
.live.is-warning .dot { background:var(--warning-500); animation-duration:1s; }
@keyframes pulse { 50% { opacity:.25; } }

.position { display:grid; gap:var(--space-1); }
.position .label { font-size:15px; color:var(--text-muted); font-weight:500; }
.position .value { font-size:48px; line-height:56px; font-weight:800; color:var(--text-strong); letter-spacing:-0.02em; }
.position .value small { font-size:24px; font-weight:700; margin-left:2px; }
.position .wait { font-size:15px; color:var(--text-default); }
.position .wait b { font-weight:700; color:var(--text-strong); }

.progress { height:8px; border-radius:var(--radius-pill); background:var(--gray-100); overflow:hidden; }
.progress > span { display:block; height:100%; border-radius:inherit; background:var(--primary-600); transition:width var(--dur-base) var(--ease-out); }

.notes { list-style:none; margin:0; padding:var(--space-4) 0 0; border-top:1px solid var(--border-default); display:grid; gap:var(--space-2); text-align:left; font-size:14px; line-height:20px; color:var(--text-muted); }
.notes li { display:grid; grid-template-columns:16px 1fr; gap:var(--space-2); }
.notes li::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--gray-300); margin:8px 0 0 5px; }

/* 결과형 상태(차례가 됨, 빠짐, 오픈 전, 오류): 원 아이콘 + 제목 + 설명 + 행동 */
.state { display:grid; justify-items:center; gap:var(--space-3); }
.state-icon { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-size:26px; font-weight:800; }
.state-icon.is-success { background:var(--success-50); color:var(--success-600); }
.state-icon.is-warning { background:var(--warning-50); color:var(--warning-700); }
.state-icon.is-info { background:var(--info-50); color:var(--info-600); }
.state-icon.is-danger { background:var(--danger-50); color:var(--danger-600); }
.state-icon.is-pending { background:var(--primary-50); color:var(--primary-600); }
.state-icon .spinner { width:26px; height:26px; border-width:3px; }
.state p { max-width:400px; }
.actions { display:grid; gap:var(--space-2); margin-top:var(--space-2); }
.trace { font-size:12px; color:var(--text-muted); }

/* ── 6. 샘플 전용 조작 (실제 화면에는 없다) ── */
.demo { position:fixed; right:var(--space-4); bottom:var(--space-4); width:230px; padding:var(--space-4); background:#fff; border:1.5px dashed var(--gray-300); border-radius:var(--radius-md); font-size:13px; line-height:18px; z-index:20; box-shadow:var(--shadow-md); }
.demo summary { font-weight:700; color:var(--text-strong); cursor:pointer; }
.demo summary span { font-weight:500; color:var(--text-muted); }
.demo[open] summary { margin-bottom:var(--space-2); }
.demo fieldset { border:0; margin:0; padding:0; display:grid; gap:6px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true"></span>이선좌</a>
    <ol class="steps" aria-label="예매 단계">
      <li class="step current" aria-current="step"><span class="step-dot" aria-hidden="true">1</span><span class="step-label">대기열</span></li>
      <li class="step"><span class="step-dot" aria-hidden="true">2</span><span class="step-label">좌석 선택</span></li>
      <li class="step"><span class="step-dot" aria-hidden="true">3</span><span class="step-label">결제</span></li>
      <li class="step"><span class="step-dot" aria-hidden="true">4</span><span class="step-label">완료</span></li>
    </ol>
    <nav class="menu" aria-label="주 메뉴">
      <a class="btn btn-ghost" href="#">내 예매</a>
      <a class="btn btn-ghost" href="#">내 정보</a>
      <button class="btn btn-ghost" type="button">로그아웃</button>
    </nav>
  </div>
</header>

<main class="page">
  <div class="queue">
    <!-- 공연 상세의 [예매하기]가 넘긴 값. 새 탭으로 주소만 열면 이 줄이 없다 -->
    <div class="concert-line" id="concertLine">
      <span class="poster" aria-hidden="true"></span>
      <div>
        <h1 class="t-heading">노을섬 단독 콘서트 〈새벽의 좌석〉</h1>
        <p class="t-body-sm muted num">2026.11.20 (금) 20:00 · 한강 아트홀</p>
      </div>
    </div>

    <section class="card queue-card" id="card" aria-live="polite"></section>
  </div>
</main>

<details class="demo" open>
  <summary>샘플 전용 조작 <span>(실제 화면에 없음)</span></summary>
  <fieldset id="demoStates">
    <label><input type="radio" name="state" value="joining"> 줄 서는 중</label>
    <label><input type="radio" name="state" value="waiting" checked> 대기 중</label>
    <label><input type="radio" name="state" value="unstable"> 연결 불안정(503)</label>
    <label><input type="radio" name="state" value="admitting"> 차례가 됨</label>
    <label><input type="radio" name="state" value="expired"> 줄에서 빠짐(404)</label>
    <label><input type="radio" name="state" value="notOpen"> 오픈 전(409)</label>
    <label><input type="radio" name="state" value="failed"> 예상하지 못한 오류</label>
  </fieldset>
</details>

<script>
// 샘플용 값. 실제 화면은 POST /queue·GET /queue/me 응답의 position·estimatedWaitSeconds를 그리고,
// nextPollAfterMillis(서버가 3~10초에 jitter를 섞은 값)만큼 기다렸다 다시 조회한다.
const fmt = new Intl.NumberFormat('ko-KR');
const INITIAL = 18420;
let position = 15234;
let timer = null;

function waitText(seconds) {
  if (seconds < 60) return '1분 미만';
  const m = Math.floor(seconds / 60);
  return `약 ${fmt.format(m)}분`;
}

function waitingMarkup({ unstable }) {
  const progress = Math.round(Math.min(1, Math.max(0, (INITIAL - position) / INITIAL)) * 100);
  return `
    <span class="live ${unstable ? 'is-warning' : ''}"><span class="dot" aria-hidden="true"></span>${unstable ? '연결이 잠시 불안정해요. 곧 다시 시도할게요' : '순번을 자동으로 확인하고 있어요'}</span>
    <div class="position">
      <p class="label">내 순번</p>
      <p class="value num">${fmt.format(position)}<small>번</small></p>
      <p class="wait">예상 대기 <b class="num">${waitText(Math.ceil(position / 50))}</b></p>
    </div>
    <div class="progress" role="progressbar" aria-label="대기 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><span style="width:${progress}%"></span></div>
    <ul class="notes">
      <li>차례가 되면 좌석 선택 화면으로 바로 넘어가요.</li>
      <li>새로고침하거나 창을 닫았다 다시 열어도 자리는 그대로예요.</li>
    </ul>`;
}

const STATES = {
  joining: () => `
    <div class="state" role="status">
      <span class="state-icon is-pending" aria-hidden="true"><span class="spinner"></span></span>
      <h2 class="t-title">줄을 서고 있어요</h2>
      <p class="muted">잠시만 기다려 주세요.</p>
    </div>`,
  waiting: () => waitingMarkup({ unstable: false }),
  unstable: () => waitingMarkup({ unstable: true }),
  admitting: () => `
    <div class="state" role="status">
      <span class="state-icon is-success" aria-hidden="true">✓</span>
      <h2 class="t-title">차례가 됐어요</h2>
      <p class="muted">좌석 선택 화면으로 이동하고 있어요.</p>
    </div>
    <div class="progress" aria-hidden="true"><span style="width:100%"></span></div>`,
  expired: () => `
    <div class="state">
      <span class="state-icon is-warning" aria-hidden="true">!</span>
      <h2 class="t-title">입장 시간이 지나 줄에서 빠졌어요</h2>
      <p class="muted">다시 줄을 서면 맨 뒤에서 시작해요.</p>
    </div>
    <div class="actions">
      <button class="btn btn-primary btn-lg btn-block" type="button">다시 줄 서기</button>
      <a class="btn btn-ghost btn-block" href="#">공연 정보로 돌아가기</a>
    </div>`,
  notOpen: () => `
    <div class="state">
      <span class="state-icon is-info" aria-hidden="true">i</span>
      <h2 class="t-title">아직 오픈 전이에요</h2>
      <p class="muted">오픈 시각이 되면 공연 화면에서 [예매하기]를 다시 눌러 주세요.</p>
    </div>
    <div class="actions">
      <a class="btn btn-primary btn-lg btn-block" href="#">공연 정보로 돌아가기</a>
    </div>`,
  failed: () => `
    <div class="state">
      <span class="state-icon is-danger" aria-hidden="true">!</span>
      <h2 class="t-title">문제가 생겼어요</h2>
      <p class="muted">다시 시도해도 같으면 문의할 때 아래 번호를 알려 주세요.</p>
      <p class="trace num">문의 번호 6a1f0c2e9b7d4e31</p>
    </div>
    <div class="actions">
      <button class="btn btn-primary btn-lg btn-block" type="button">다시 시도</button>
      <a class="btn btn-ghost btn-block" href="#">공연 정보로 돌아가기</a>
    </div>`,
};

const card = document.getElementById('card');
function show(state) {
  clearInterval(timer);
  card.innerHTML = STATES[state]();
  if (state === 'waiting') {
    // 순번이 줄어드는 흉내. 실제로는 조회 응답마다 바뀐다
    timer = setInterval(() => {
      position = Math.max(1, position - 150 - Math.floor(Math.random() * 30));
      card.innerHTML = STATES.waiting();
    }, 3000);
  }
}

document.getElementById('demoStates').addEventListener('change', (e) => show(e.target.value));

// 스크린숏·리뷰용: #demo=joining | waiting | unstable | admitting | expired | notOpen | failed, &concert=0이면 공연 줄 없음
const params = new URLSearchParams(location.hash.slice(1));
const initial = params.get('demo') in STATES ? params.get('demo') : 'waiting';
document.querySelector(`input[value="${initial}"]`).checked = true;
if (params.get('concert') === '0') document.getElementById('concertLine').remove();
if (params.get('panel') === '0') document.querySelector('.demo').remove();
show(initial);
</script>
</body>
</html>
