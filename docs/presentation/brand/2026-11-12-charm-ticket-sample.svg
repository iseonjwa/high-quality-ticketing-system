<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="발권 이벤트 부적 시안. 티켓 모양 틀 안에 합격 토끼 펫, 닉네임, 전투력, 응원 문장, 떼는 칸의 공연 날짜와 합격 기원 도장이 있다" font-family="'Pretendard Variable', Pretendard, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4545E0"/>
      <stop offset="1" stop-color="#2F2FAE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#7B7BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7B7BFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 좌석 배치도 무늬. 서비스의 좌석 선택 화면을 바탕에 깐다 -->
    <pattern id="seats" width="48" height="44" patternUnits="userSpaceOnUse">
      <rect x="15" y="15" width="18" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
    <pattern id="seatsPanel" width="40" height="36" patternUnits="userSpaceOnUse" x="4" y="6">
      <rect x="12" y="12" width="16" height="12" rx="3.5" fill="#DDE1FF" fill-opacity="0.75"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#0B0B3A" flood-opacity="0.38"/>
    </filter>
    <!-- 절취선 양 끝 홈. 바탕이 그라데이션이라 색으로 칠하지 않고 실제로 구멍을 낸다(.ticket-pass와 같은 방식) -->
    <mask id="notch">
      <rect width="1080" height="1920" fill="#FFFFFF"/>
      <circle cx="80" cy="1350" r="26" fill="#000000"/>
      <circle cx="1000" cy="1350" r="26" fill="#000000"/>
    </mask>
    <clipPath id="panelClip">
      <rect x="144" y="284" width="792" height="576" rx="36"/>
    </clipPath>
    <clipPath id="bodyClip">
      <path d="M390 700 C390 560 450 500 540 500 C630 500 690 560 690 700 C690 770 630 790 540 790 C450 790 390 770 390 700 Z"/>
    </clipPath>
  </defs>

  <!-- 바탕 -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#seats)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <text x="540" y="104" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.82">ISEONJWA · LUCKY TICKET</text>

  <!-- 티켓 -->
  <g filter="url(#shadow)">
    <rect x="80" y="160" width="920" height="1600" rx="44" fill="#FFFFFF" mask="url(#notch)"/>
  </g>
  <line x1="132" y1="1350" x2="948" y2="1350" stroke="#D7DAE2" stroke-width="4" stroke-dasharray="14 12" stroke-linecap="round"/>

  <!-- 머리 -->
  <text x="144" y="238" font-size="24" font-weight="700" letter-spacing="5" fill="#676C7E">ADMIT 1</text>
  <rect x="790" y="204" width="146" height="46" rx="23" fill="#EEF0FF"/>
  <text x="863" y="236" text-anchor="middle" font-size="23" font-weight="700" fill="#2F2FAE">행운 부적</text>

  <!-- 펫 칸 -->
  <rect x="144" y="284" width="792" height="576" rx="36" fill="#EEF0FF"/>
  <g clip-path="url(#panelClip)">
    <rect x="144" y="284" width="792" height="576" fill="url(#seatsPanel)"/>
    <circle cx="540" cy="610" r="250" fill="#EEF0FF"/>
    <circle cx="540" cy="610" r="250" fill="none" stroke="#DDE1FF" stroke-width="3"/>
    <circle cx="540" cy="610" r="205" fill="#DDE1FF"/>
  </g>
  <!-- 반짝이 -->
  <path d="M258 352 Q258 380 286 380 Q258 380 258 408 Q258 380 230 380 Q258 380 258 352 Z" fill="#5B5BF0"/>
  <path d="M828 392 Q828 428 864 428 Q828 428 828 464 Q828 428 792 428 Q828 428 828 392 Z" fill="#F59F00"/>
  <path d="M810 728 Q810 748 830 748 Q810 748 810 768 Q810 748 790 748 Q810 748 810 728 Z" fill="#5B5BF0"/>
  <path d="M262 724 Q262 740 278 740 Q262 740 262 756 Q262 740 246 740 Q262 740 262 724 Z" fill="#F59F00"/>

  <!-- 펫: 합격 토끼 -->
  <g stroke="#14161E" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="540" cy="814" rx="160" ry="16" fill="#3B3BD4" fill-opacity="0.14" stroke="none"/>
    <ellipse cx="478" cy="430" rx="40" ry="100" transform="rotate(-12 478 430)" fill="#FFF8EC"/>
    <ellipse cx="604" cy="430" rx="40" ry="100" transform="rotate(12 604 430)" fill="#FFF8EC"/>
    <ellipse cx="478" cy="432" rx="17" ry="64" transform="rotate(-12 478 432)" fill="#FFC2CF" stroke="none"/>
    <ellipse cx="604" cy="432" rx="17" ry="64" transform="rotate(12 604 432)" fill="#FFC2CF" stroke="none"/>
    <ellipse cx="482" cy="792" rx="36" ry="20" fill="#FFF8EC"/>
    <ellipse cx="598" cy="792" rx="36" ry="20" fill="#FFF8EC"/>
    <path d="M390 700 C390 560 450 500 540 500 C630 500 690 560 690 700 C690 770 630 790 540 790 C450 790 390 770 390 700 Z" fill="#FFF8EC"/>
  </g>
  <!-- 머리띠 -->
  <g clip-path="url(#bodyClip)">
    <rect x="380" y="566" width="320" height="46" fill="#D12B3A"/>
  </g>
  <path d="M390 700 C390 560 450 500 540 500 C630 500 690 560 690 700 C690 770 630 790 540 790 C450 790 390 770 390 700 Z" fill="none" stroke="#14161E" stroke-width="7" stroke-linejoin="round"/>
  <line x1="398" y1="566" x2="682" y2="566" stroke="#14161E" stroke-width="5" stroke-linecap="round" clip-path="url(#bodyClip)"/>
  <line x1="393" y1="612" x2="687" y2="612" stroke="#14161E" stroke-width="5" stroke-linecap="round" clip-path="url(#bodyClip)"/>
  <text x="540" y="600" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="6" fill="#FFFFFF">합격</text>
  <g fill="#D12B3A" stroke="#14161E" stroke-width="5" stroke-linejoin="round">
    <path d="M676 582 L734 556 L742 578 L684 596 Z"/>
    <path d="M680 600 L728 636 L714 652 L674 610 Z"/>
  </g>
  <!-- 얼굴 -->
  <ellipse cx="495" cy="664" rx="13" ry="16" fill="#14161E"/>
  <ellipse cx="585" cy="664" rx="13" ry="16" fill="#14161E"/>
  <circle cx="490" cy="657" r="5" fill="#FFFFFF"/>
  <circle cx="580" cy="657" r="5" fill="#FFFFFF"/>
  <ellipse cx="460" cy="700" rx="22" ry="12" fill="#FF9BB0" fill-opacity="0.75"/>
  <ellipse cx="620" cy="700" rx="22" ry="12" fill="#FF9BB0" fill-opacity="0.75"/>
  <path d="M525 690 Q532.5 701 540 690 Q547.5 701 555 690" fill="none" stroke="#14161E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 품에 안은 작은 티켓 -->
  <rect x="474" y="724" width="132" height="54" rx="9" fill="#3B3BD4" stroke="#14161E" stroke-width="5"/>
  <text x="540" y="757" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#FFFFFF">ADMIT</text>
  <circle cx="480" cy="750" r="19" fill="#FFF8EC" stroke="#14161E" stroke-width="6"/>
  <circle cx="600" cy="750" r="19" fill="#FFF8EC" stroke="#14161E" stroke-width="6"/>

  <!-- 펫 이름 -->
  <text x="144" y="922" font-size="34" font-weight="700" fill="#14161E">합격 토끼 콩떡<tspan font-size="26" font-weight="500" fill="#676C7E" dx="14">나의 수호펫</tspan></text>
  <line x1="144" y1="962" x2="936" y2="962" stroke="#E9EBF0" stroke-width="2"/>

  <!-- 닉네임·전투력 -->
  <text x="144" y="1008" font-size="24" font-weight="600" fill="#676C7E">닉네임</text>
  <text x="144" y="1064" font-size="46" font-weight="800" letter-spacing="-1" fill="#14161E">꿈꾸는개발자</text>
  <text x="600" y="1008" font-size="24" font-weight="600" fill="#676C7E">전투력</text>
  <path d="M614 1024 L596 1050 L610 1050 L602 1072 L626 1040 L612 1040 L620 1024 Z" fill="#F59F00" stroke="#9A5200" stroke-width="2" stroke-linejoin="round"/>
  <text x="638" y="1064" font-size="46" font-weight="800" letter-spacing="-1" fill="#3B3BD4" style="font-variant-numeric: tabular-nums">87,420</text>
  <line x1="144" y1="1102" x2="936" y2="1102" stroke="#E9EBF0" stroke-width="2"/>

  <!-- 응원 문장 -->
  <rect x="144" y="1130" width="118" height="42" rx="21" fill="#FFF4E5"/>
  <text x="203" y="1159" text-anchor="middle" font-size="22" font-weight="700" fill="#9A5200">취업 응원</text>
  <text x="144" y="1232" font-size="50" font-weight="800" letter-spacing="-1.5" fill="#14161E">대기열은 결국 줄어들어요.</text>
  <text x="144" y="1298" font-size="50" font-weight="800" letter-spacing="-1.5" fill="#14161E">당신 차례도 반드시 와요.</text>

  <!-- 떼는 칸 -->
  <text x="144" y="1486" font-size="112" font-weight="800" letter-spacing="-4" fill="#14161E" style="font-variant-numeric: tabular-nums">11.28</text>
  <text x="148" y="1534" font-size="30" font-weight="600" fill="#373B4A">토요일 19:00</text>
  <text x="144" y="1596" font-size="30" font-weight="700" fill="#14161E">노을섬 단독 콘서트 〈새벽의 좌석〉</text>
  <text x="144" y="1638" font-size="26" font-weight="500" fill="#4D5263">VIP석 · A구역 3열 12번</text>
  <!-- 합격 기원 도장(부적의 붉은 인) -->
  <g transform="rotate(-8 836 1478)">
    <rect x="751" y="1393" width="170" height="170" rx="16" fill="#D12B3A" fill-opacity="0.06" stroke="#D12B3A" stroke-width="7"/>
    <rect x="765" y="1407" width="142" height="142" rx="9" fill="none" stroke="#D12B3A" stroke-width="2.5"/>
    <text x="836" y="1470" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="4" fill="#D12B3A">합격</text>
    <text x="836" y="1532" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="4" fill="#D12B3A">기원</text>
  </g>
  <!-- 꾸밈 바코드 -->
  <g id="barcode" fill="#14161E"><rect x="144.00" y="1666" width="11.82" height="48"/><rect x="167.64" y="1666" width="17.73" height="48"/><rect x="191.28" y="1666" width="17.73" height="48"/><rect x="214.93" y="1666" width="17.73" height="48"/><rect x="244.48" y="1666" width="5.91" height="48"/><rect x="256.30" y="1666" width="5.91" height="48"/><rect x="274.03" y="1666" width="5.91" height="48"/><rect x="285.85" y="1666" width="5.91" height="48"/><rect x="297.67" y="1666" width="5.91" height="48"/><rect x="315.40" y="1666" width="17.73" height="48"/><rect x="344.96" y="1666" width="5.91" height="48"/><rect x="356.78" y="1666" width="5.91" height="48"/><rect x="374.51" y="1666" width="5.91" height="48"/><rect x="392.24" y="1666" width="11.82" height="48"/><rect x="409.97" y="1666" width="5.91" height="48"/><rect x="427.70" y="1666" width="11.82" height="48"/><rect x="445.43" y="1666" width="5.91" height="48"/><rect x="457.25" y="1666" width="5.91" height="48"/><rect x="474.99" y="1666" width="11.82" height="48"/><rect x="492.72" y="1666" width="5.91" height="48"/><rect x="504.54" y="1666" width="5.91" height="48"/><rect x="522.27" y="1666" width="17.73" height="48"/><rect x="551.82" y="1666" width="5.91" height="48"/><rect x="563.64" y="1666" width="5.91" height="48"/><rect x="581.37" y="1666" width="17.73" height="48"/><rect x="605.01" y="1666" width="17.73" height="48"/><rect x="634.57" y="1666" width="5.91" height="48"/><rect x="652.30" y="1666" width="5.91" height="48"/><rect x="664.12" y="1666" width="17.73" height="48"/><rect x="693.67" y="1666" width="17.73" height="48"/><rect x="723.22" y="1666" width="5.91" height="48"/><rect x="735.04" y="1666" width="5.91" height="48"/><rect x="746.87" y="1666" width="5.91" height="48"/><rect x="764.60" y="1666" width="11.82" height="48"/><rect x="782.33" y="1666" width="11.82" height="48"/><rect x="800.06" y="1666" width="5.91" height="48"/><rect x="817.79" y="1666" width="17.73" height="48"/><rect x="847.34" y="1666" w