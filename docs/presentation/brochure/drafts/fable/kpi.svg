<text x="64" y="142" font-size="22" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">모든 숫자는 배포 EC2 한 대 + 별도 부하 발생기 EC2에서 쟀습니다</text>
<!-- 타일 1: LEDGER.md 1절 ① -->
<rect x="64.0" y="164.0" width="474.7" height="348" rx="24" fill="#FFFFFF"/>
