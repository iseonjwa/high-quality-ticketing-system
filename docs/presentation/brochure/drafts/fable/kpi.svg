<text x="94.0" y="754.0" font-size="20" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">당첨 약 2,000건 <tspan font-weight="800" fill="#FFFFFF" fill-opacity="1">약 11분 → 4분 안 100%</tspan></text>
