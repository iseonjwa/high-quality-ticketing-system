xt><text x="840" y="214" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#676C7E" text-anchor="start" font-weight="400">거절 위치를 앞으로(H1) → 요청 로그 끔(H2)</text><text x="1182" y="262" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#676C7E" text-anchor="middle" font-weight="400">굿풋(요청/초)</text><line x1="846" y1="630" x2="1518" y2="630" stroke="#E1E4EA" stroke-width="2"/><rect x="921.0" y="425.9" width="150.0" height="204.1" rx="8" fill="#B4B8C5"/><text x="996.0" y="411.9076923076923" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" fill="#14161E" text-anchor="middle" font-weight="700">1,608</text><text x="996.0" y="664" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">기준</text><rect x="1107.0" y="399.8" width="150.0" height="230.2" rx="8" fill="#8C8CE8"/><text x="1182.0" y="385.76153846153846" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" fill="#14161E" text-anchor="middle" font-weight="700">1,814</text><text x="1182.0" y="664" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">H1 거절 위치</text><text x="1182.0" y="688" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">HttpHandler 앞</text><rect x="1293.0" y="360.7" width="150.0" height="269.3" rx="8" fill="#3B3BD4"/><text x="1368.0" y="346.66923076923075" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" fill="#14161E" text-anchor="middle" font-weight="700">2,122</text><text x="1368.0" y="664" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">H2 요청 로그</text><text x="1368.0" y="688" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">끔(실험)</text><rect x="1050" y="728" width="240" height="42" rx="21.0" fill="#E8F6EF"/><text x="1170.12" y="754" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#1F8A5B" text-anchor="middle" font-weight="700">1,608 → 2,122 /s</text><text x="48" y="872" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#676C7E" text-anchor="start" font-weight="400">출처: docs/presentation/performance/2026-11-14-gateway-overload-one-page.md · 배포 EC2 m7i.xlarge(4 vCPU) 1대 + 같은 VPC k6 발생기 · 11/11~12 · 각 1회(같은 값 반복 차 약 5%) · 굿풋 = 200ms 안에 끝난 200 응답/초</text>
