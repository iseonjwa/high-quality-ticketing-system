<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect width="1600" height="900" fill="#FBFBFD"/><text x="48" y="64" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="38" fill="#14161E" text-anchor="start" font-weight="700">Gateway: 줄을 세울 자리를 맨 앞으로</text><text x="48" y="104" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="21" fill="#676C7E" text-anchor="start" font-weight="400">동시 처리 상한 64를 리틀의 법칙으로 계산해 넣고, 넘치는 요청은 가장 싼 자리에서 503 + 다시 시도할 시간으로 돌려보냈다</text><rect x="48" y="140" width="740" height="640" rx="16" fill="#FFFFFF" stroke="#E1E4EA" stroke-width="1.5"/><text x="76" y="184" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#14161E" text-anchor="start" font-weight="700">초당 2,000건 · 상한 없음 대 상한 64</text><text x="76" y="214" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#676C7E" text-anchor="start" font-weight="400">같은 배포에서 대조군(상한 500)과 비교</text><text x="150" y="262" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#676C7E" text-anchor="middle" font-weight="400">굿풋(요청/초)</text><line x1="76" y1="630" x2="374" y2="630" stroke="#E1E4EA" stroke-width="2"/><rect x="96.0" y="450.7" width="111.0" height="179.3" rx="8" fill="#B4B8C5"/><text x="151.5" y="436.7" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" fill="#14161E" text-anchor="middle" font-weight="700">1,304</text><text x="151.5" y="664" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">상한 500</text><text x="151.5" y="688" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">(사실상 없음)</text><rect x="243.0" y="396.8" width="111.0" height="233.2" rx="8" fill="#3B3BD4"/><text x="298.5" y="382.8" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="26" fill="#14161E" text-anchor="middle" font-weight="700">1,696</text><text x="298.5"