<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect width="1600" height="900" fill="#FBFBFD"/><text x="48" y="64" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="38" fill="#14161E" text-anchor="start" font-weight="700">추첨 자동결제: 10분 안 95%를 100%로</text><text x="48" y="104" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="21" fill="#676C7E" text-anchor="start" font-weight="400">빠른 손이 아니어도 당첨되면 등록한 카드로 결제된다. 그 결제가 늦지 않게 원인을 측정으로 좁혀 고쳤다</text><rect x="48" y="140" width="740" height="640" rx="16" fill="#FFFFFF" stroke="#E1E4EA" stroke-width="1.5"/><text x="76" y="184" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#14161E" text-anchor="start" font-weight="700">추첨 뒤 10분 안 자동결제 완료율</text><line x1="76" y1="670" x2="764" y2="670" stroke="#E1E4EA" stroke-width="2"/><rect x="172.0" y="314.9" width="230.0" height="355.1" rx="8" fill="#B4B8C5"/><text x="287.0" y="358.90909090909093" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" fill="#14161E" text-anchor="middle" font-weight="700">92.4~93.4%</text><text x="287.0" y="704" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">개선 전</text><text x="287.0" y="728" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">(3회, 11/10)</text><rect x="438.0" y="288.2" width="230.0" height="381.8" rx="8" fill="#3B3BD4"/><text x="553.0" y="332.1818181818182" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="700">100%</text><text x="553.0" y="704" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">개선 후</text><text x="553.0" y="728" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">(2회, 11/13)</text><line x1="80" y1="307" x2="760" y2="307" stroke="#D9480F" stroke-width="2.5" stroke-dasharray="8 6"/><text x="84" y="295.27272727272725" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#D9480F" text-anchor="start" font-weight="700">합격선 95%</text><rect x="812" y="140" width="740" height="300" rx="16" fill="#FFFFFF" stroke="#E1E4EA" stroke-width="1.5"/><text x="840" y="184" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#14161E" text-anchor="start" font-weight="700">처리 속도와 마지막 결제 시점</text><text x="980" y="260" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="54" fill="#3B3BD4" text-anchor="middle" font-weight="800">3.2 → 9.4</text><text x="980" y="300" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#676C7E" text-anchor="middle" font-weight="400">자동결제 건/초</text><text x="1360" y="260" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="50" fill="#3B3BD4" text-anchor="middle" font-weight="800">610 → 205초</text><text x="1360" y="300" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#676C7E" text-anchor="middle" font-weight="400">결제 완료 p95(추첨 뒤)</text><text x="1182" y="386" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#373B4A" text-anchor="middle" font-weight="400">원인: 결제 명령 소비자 1개의 직렬 대기(PG 지연 스윕으로 확정)</text><rect x="812" y="480" width="740" height="300" rx="16" fill="#FFFFFF" stroke="#E1E4EA" stroke-width="1.5"/><text x="840" y="524" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#14161E" text-anchor="start" font-weight="700">겹친 일반 결제의 503</text><text x="1182" y="620" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="64" fill="#3B3BD4" text-anchor="middle" font-weight="800">9.5% → 0</text><text x="1182" y="670" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="19" fill="#676C7E" text-anchor="middle" font-weight="400">소비자 3 + 자동결제 전용 PG 허가 3으로 분리</text><text x="48" y="872" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#676C7E" text-anchor="start" font-weight="400">출처: docs/design/lottery/numbers-and-measurement.md 3-3·3-5·3-6절, ADR 0051 · 배포 EC2 1대, 응모 30,000명·추첨석 3,000·당첨 약 2,000건, Mock PG 300ms · 개선 전 11/10 3회, 후 11/13 2회(날이 달라 참고값)</text>
</svg>
