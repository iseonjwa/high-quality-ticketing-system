<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="티켓 오픈의 폭주 트래픽을 견디는 콘서트 예매 서비스, 이선좌"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" />
    <!-- 첫 그리기 전에 화면 모드를 정한다. 규칙·키·색은 src/lib/theme.ts와 같다(design-system.md 2-5절).
         src/lib/themeScript.test.ts가 이 스크립트를 그대로 실행해 확인한다 -->
    <script>
      ;(function () {
        var theme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        try {
          var stored = localStorage.getItem('iseonjwa:theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          }
        } catch (error) {
          // 저장소를 막은 브라우저는 운영체제 설정을 따른다
        }
        document.documentElement.dataset.theme = theme
        // 휴대폰 주소창 색도 고른 모드를 따른다
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) {
          themeColor.setAttribute('content', theme === 'dark' ? '#0c0d13' : '#fbfbfd')
        }
      })()
    </script>
    <title>이선좌 · 콘서트 예매</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
