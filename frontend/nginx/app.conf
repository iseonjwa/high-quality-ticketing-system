# 화면(SPA) 서빙과 /api/ 중계. server 블록 안에서 include한다.
# 로컬·이미지 기본 설정(default.conf)과 배포 서버 설정(deploy.conf)이 같은 내용을 쓰게 한 곳에 둔다.
# 정적 파일은 빌드 결과(dist)이고, 없는 경로는 index.html로 돌려 SPA 라우터가 처리한다.

root /usr/share/nginx/html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# 서비스(user·reservation·payment)로 바로 넘기는 경로는 두지 않는다.
# 서비스는 Gateway가 검증해 넣은 사용자 헤더를 서명 없이 믿으므로 Gateway만 거쳐야 한다.
location /api/ {
    proxy_pass http://gateway_upstream;  # URI 없음: 요청 경로(/api/v1/...)를 그대로 넘긴다
    # keepalive 재사용에 필요하다(HTTP/1.1, Connection 헤더 비움).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/security-headers.conf;
}

# 진입 문서는 항상 새로 받아 새 빌드의 해시 파일을 가리키게 한다.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
}

# 해시가 붙은 정적 파일은 오래 캐시한다. 없는 파일에 HTML을 돌려주지 않는다(JS 자리에 HTML이 가는 것을 막는다).
location /assets/ {
    try_files $uri =404;
    # always를 빼서 404 응답에는 장기 캐시 헤더가 붙지 않게 한다
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
}

location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
}
