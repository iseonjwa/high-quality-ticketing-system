# 프론트 SPA를 서빙하고 /api/ 요청을 Gateway로 중계한다(ADR 0040).
# 브라우저는 이 서버 한 곳만 보므로 CORS가 필요 없다.
# 로컬 compose와 이미지의 기본 설정이다. 배포 서버는 compose.deploy.yml이 이 파일 자리에 deploy.conf를 마운트한다(ISE-278).
# 화면과 /api/ 경로는 app.conf, Gateway 연결 묶음은 gateway-upstream.conf에 있다.

server {
    server_tokens off;
    listen 80;
    include /etc/nginx/app.conf;
}
