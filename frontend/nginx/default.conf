# 프론트 SPA를 서빙하고 /api/ 요청을 Gateway로 중계한다(ADR 0040).
# 정적 파일은 빌드 결과(dist)이고, 없는 경로는 index.html로 돌려 SPA 라우터가 처리한다.
# 브라우저는 이 서버 한 곳만 보므로 CORS가 필요 없다.

# Gateway로 가는 연결 묶음.
# - resolve: compose 내부 DNS(127.0.0.11)로 이름을 주기적으로 다시 푼다. Gateway 컨테이너가 다시 만들어져 IP가 바뀌어도 따라가고,
#   nginx가 뜰 때 Gateway가 아직 없어도 nginx는 뜬다.
# - keepalive: Gateway 연결을 재사용한다. 요청마다 새 연결을 맺으면 nginx 쪽에 TIME_WAIT가 쌓여 요청이 많을 때 연결할 포트가 바닥난다.
upstream gateway_upstream {
    zone gateway_upstream 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server gateway:8080 resolve;
    keepalive 32;
}

server {
    server_tokens off;
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 서비스(user·reservation·payment)로 바로 넘기는 경로는 두지 않는다.
    # 서비스는 Gateway가 검증해 넣은 사용자 헤더를 서명 없이 믿으므로 Gateway만 거쳐야 한다.
    location /api/ {
        proxy_pass http://gateway_upstream;  # URI 없음: 요청 경로(/api/v1/...)를 그대로 넘긴다
        # keepalive 재사용에 필요하다(HTTP/1.1, Connection 헤더 비움).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;
    }

    # 진입 문서는 항상 새로 받아 새 빌드의 해시 파일을 가리키게 한다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # 해시가 붙은 정적 파일은 오래 캐시한다. 없는 파일에 HTML을 돌려주지 않는다(JS 자리에 HTML이 가는 것을 막는다).
    location /assets/ {
        try_files $uri =404;
        # always를 빼서 404 응답에는 장기 캐시 헤더가 붙지 않게 한다
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }
}
