# 배포 서버의 프론트 nginx 설정(ISE-278). compose.deploy.yml이 이미지의 default.conf 자리에 마운트한다.
# 이미지에는 넣지 않는다(Dockerfile이 복사하지 않음). 로컬은 지금처럼 default.conf를 쓴다.
# 로컬과 다른 점: Let's Encrypt 인증서 발급·갱신 확인 경로를 80에 둔다.

server {
    server_tokens off;
    listen 80;

    # Note: 서버의 certbot이 webroot 방식으로 /var/www/certbot/.well-known/acme-challenge/<토큰> 파일을 쓰면,
    # Let's Encrypt가 http://<서버 IP>/.well-known/acme-challenge/<토큰>을 읽어 이 IP의 주인인지 확인한다(HTTP-01).
    # 갱신 때도 같은 확인이 80으로 오므로 443을 붙인 뒤에도 이 경로는 80에 남긴다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/app.conf;
}
