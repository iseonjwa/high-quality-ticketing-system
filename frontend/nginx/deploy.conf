# 배포 서버의 프론트 nginx 설정(ISE-278). compose.deploy.yml이 이미지의 default.conf 자리에 마운트한다.
# 이미지에는 넣지 않는다(Dockerfile이 복사하지 않음). 로컬은 지금처럼 default.conf(80, http)를 쓴다.
# 로컬과 다른 점: 바깥 요청은 https(443)로 받고, Let's Encrypt 확인 경로를 80에 두며, Grafana를 /grafana/로 중계한다.
#
# 서버 주소는 이 파일에 적지 않는다. https로 넘길 때는 요청의 Host를 쓰고, 인증서는 certbot에서 붙인 이름(iseonjwa)으로 찾는다.
# 공개 주소는 서버 .env의 PUBLIC_URL 한 곳에만 있다(compose.deploy.yml).
#
# Note: 이 파일이 가리키는 인증서가 없으면 nginx가 뜨지 않고 deploy.sh가 직전 버전으로 되돌린다.
# 새 서버에서는 인증서를 먼저 받는다(docs/design/infra/deployment.md "HTTPS 인증서").

# Grafana Live(대시보드 실시간 갱신)가 쓰는 WebSocket 연결을 넘기기 위한 값이다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Grafana로 가는 연결 묶음. Gateway와 같이 compose 내부 DNS로 이름을 다시 풀어, Grafana가 다시 만들어져도 따라가고
# nginx가 뜰 때 Grafana가 아직 없어도 nginx는 뜬다.
upstream grafana_upstream {
    zone grafana_upstream 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server grafana:3000 resolve;
}

# 서버 안의 스크립트(compose 헬스체크, smoke.sh, warmup.sh, seed-demo.sh)는 http://127.0.0.1로 부른다.
# 인증서는 공인 IP용이라 127.0.0.1로는 https 확인이 되지 않으므로, 이 이름으로 온 요청은 http 그대로 화면과 /api/를 준다.
# 바깥 브라우저는 Host가 공인 IP라 이 블록에 오지 않는다.
server {
    server_tokens off;
    listen 80;
    server_name 127.0.0.1 localhost;
    include /etc/nginx/app.conf;
}

# 바깥에서 온 http는 인증서 확인 경로만 두고 모두 https로 넘긴다.
server {
    server_tokens off;
    listen 80 default_server;

    # Note: 서버의 certbot이 webroot 방식으로 /var/www/certbot/.well-known/acme-challenge/<토큰> 파일을 쓰면,
    # Let's Encrypt가 http://<서버 IP>/.well-known/acme-challenge/<토큰>을 읽어 이 IP의 주인인지 확인한다(HTTP-01).
    # 갱신 때도 같은 확인이 80으로 오므로 https로 넘기지 않는다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Note: 302(임시)로 넘긴다. 301은 브라우저가 오래 기억해서, https를 되돌려 443을 닫았을 때 한 번 들른 브라우저가
    # http 주소를 열어도 https로 가 버려 열리지 않는다. HSTS를 켜지 않은 이유(되돌릴 수 있게)와 같다.
    location / {
        return 302 https://$host$request_uri;
    }
}

server {
    server_tokens off;
    listen 443 ssl default_server;
    http2 on;

    # certbot --cert-name iseonjwa로 받은 인증서. live/의 파일은 갱신 때마다 archive/의 새 파일을 가리키는 상대 링크라
    # compose.deploy.yml이 live/와 archive/를 같은 경로에 마운트한다(계정 키가 든 나머지는 넣지 않는다).
    # 갱신 뒤에는 nginx가 다시 읽어야 한다(certbot 갱신 훅, script/deploy/cert-renewed.sh).
    ssl_certificate     /etc/letsencrypt/live/iseonjwa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iseonjwa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    # Note: HSTS(Strict-Transport-Security)는 두지 않는다. IP 인증서는 약 6일짜리라 갱신이 한 번 실패하면
    # HSTS를 기억한 브라우저는 http로도 화면을 열 수 없다.

    # Grafana는 심사·시연 때 누구나 보기만 되게 연다(익명 Viewer, compose.deploy.yml). 판단 기록:
    # docs/ai-judgments/junhyun/2026-11-16-grafana-public-over-https-path.md
    # Grafana가 /grafana/ 아래에서 스스로 서빙하므로(serve_from_sub_path) 경로를 그대로 넘긴다.
    # 보안 헤더 조각은 넣지 않는다. Grafana가 자기 헤더를 단다.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://grafana_upstream;  # URI 없음: /grafana/... 경로를 그대로 넘긴다
        # Grafana는 POST 요청의 Origin과 Host를 맞춰 본다(CSRF 방지). 브라우저가 보낸 Host를 그대로 넘긴다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    include /etc/nginx/app.conf;
}
