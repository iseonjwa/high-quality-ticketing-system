# 테스트는 Config 서버·Eureka 없이 띄운다. 이 파일이 main의 application.yml을 가린다
spring:
  application:
    name: gateway
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

gateway:
  auth:
    jwt-secret: aXNlb25qd2EtdGVzdC1zZWNyZXQta2V5LTAxMjM0NTY3ODlhYmNkZWY=
    public-paths:
      - POST /api/v1/auth/login
