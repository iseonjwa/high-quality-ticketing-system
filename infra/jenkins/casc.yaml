# Jenkins 설정 코드(JCasC, ISE-175). 화면에서 설정하지 않고 이 파일로만 정한다.
# 비밀값은 컨테이너 환경 변수(/opt/jenkins/jenkins.env)와 비밀 파일(/run/secrets/deploy_ssh_key)에서 읽는다.
jenkins:
  systemMessage: "이선좌 배포 Jenkins. 설정은 infra/jenkins/casc.yaml(코드)로만 바꾼다"
  numExecutors: 1
  # 로컬 사용자 admin 하나. 가입과 익명 읽기는 없다. Jenkins UI는 공개하지 않고 SSH 터널로만 연다.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          # 배포 EC2에 접속하는 SSH 키. 사용자는 ubuntu다.
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: deploy-ssh
              username: ubuntu
              description: 배포 EC2 SSH 키
              privateKeySource:
                directEntry:
                  privateKey: ${readFile:/run/secrets/deploy_ssh_key}
          # 슬랙 #이선좌-배포상태알림 웹훅 주소
          - string:
              scope: GLOBAL
              id: slack-webhook-deploy
              description: 슬랙 #이선좌-배포상태알림 웹훅
              secret: ${SLACK_WEBHOOK_DEPLOY}

security:
  globalJobDslSecurityConfiguration:
    # JCasC가 주는 잡 정의만 쓰므로 DSL 스크립트 승인을 따로 받지 않는다.
    useScriptSecurity: false

jobs:
  - script: >
      pipelineJob('deploy-main') {
        description('main의 새 커밋을 폴링해 배포한다. TAG에 40자 커밋 SHA를 넣고 실행하면 그 커밋으로 배포한다(되돌리기·재배포)')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/iseonjwa/high-quality-ticketing-system.git') }
                branch('main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
        // 웹훅은 쓰지 않는다(Jenkins를 공개하지 않으려는 것, ADR 0044). 폴링 주기는 환경 변수로 정하고 비면 폴링하지 않는다.
        def pollSchedule = '${POLL_SCHEDULE:-}'
        if (pollSchedule) {
          triggers { scm(pollSchedule) }
        }
      }
