# Jenkins EC2에서 쓰는 compose(ISE-175). 저장소 루트에서 실행한다.
#   docker compose -f infra/jenkins/compose.yml up -d --build
# 비밀값은 저장소에 두지 않는다: /opt/jenkins/jenkins.env(JENKINS_ADMIN_PASSWORD, SLACK_WEBHOOK_DEPLOY, DEPLOY_HOST, POLL_SCHEDULE, 선택 PUBLIC_URL)와
# /opt/jenkins/deploy_ssh_key(배포 EC2에 접속하는 개인 키)는 서버에서 만들고 0600으로 둔다. 컨테이너 사용자(uid 1000)가 읽는다.
# 아래 ${JENKINS_*} 값은 로컬 시험 때 경로·포트를 바꾸려는 것이다. 서버에서는 기본값을 쓴다.
services:
  jenkins:
    build:
      context: .
    restart: unless-stopped
    mem_limit: 1200m
    # UI는 공개하지 않는다. SSH 터널로만 연다(ssh -L 8081:127.0.0.1:8080 ubuntu@<Jenkins IP>)
    ports: ["${JENKINS_BIND:-127.0.0.1:8080}:8080"]
    env_file: ${JENKINS_ENV_FILE:-/opt/jenkins/jenkins.env}
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx768m
    volumes:
      - jenkins_home:/var/jenkins_home
      - ${JENKINS_SSH_KEY_FILE:-/opt/jenkins/deploy_ssh_key}:/run/secrets/deploy_ssh_key:ro
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  jenkins_home:
