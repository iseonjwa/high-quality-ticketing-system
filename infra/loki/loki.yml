# Alloy가 보낸 컨테이너 로그를 저장하는 Loki 설정이다(ADR 0045, docs/design/infra/observability.md 1절).
# 단일 노드 단일 바이너리이고 파일시스템(/loki)에 저장한다. 호스트 포트는 열지 않고 Grafana가 compose 내부 주소로 읽는다.
# 보관은 7일이다. compactor가 오래된 로그를 지운다.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # traceId를 구조화 메타데이터로 붙이려면 켜야 한다(3.x 기본값은 켜짐이지만 의도를 드러내려 적는다).
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# 사용 통계를 외부로 보내지 않는다.
analytics:
  reporting_enabled: false
