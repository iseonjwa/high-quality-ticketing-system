global:
  scrape_interval: 5s
  evaluation_interval: 15s
# 알림 규칙. compose가 infra/prometheus/rules를 이 경로에 마운트한다(결제: payment-alerts.yml)
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:18080, host.docker.internal:18081, host.docker.internal:18082, host.docker.internal:18083, host.docker.internal:18761, host.docker.internal:19888, host.docker.internal:18090]
