global:
  scrape_interval: 5s
  evaluation_interval: 15s
  # 알림을 어느 환경에서 보냈는지 슬랙에서 가린다. compose가 STACK_ENV를 넘긴다(기본 local)
  external_labels:
    env: ${STACK_ENV}
# 알림 전송: Alertmanager가 슬랙으로 보낸다(infra/alertmanager/alertmanager.yml)
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
# 알림 규칙. compose가 infra/prometheus/rules를 이 경로에 마운트한다(결제: payment-alerts.yml)
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:9080, user-service:9080, reservation-service:9080, payment-service:9080, eureka:9080, config-server:9080, mock-pg:9080]
