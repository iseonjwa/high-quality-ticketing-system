# 서비스의 /actuator/prometheus를 15초마다 수집한다
# 아직 뜨지 않은 서비스는 Targets 화면에 DOWN으로 보일 뿐 수집에는 영향이 없다
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # compose 안에서 도는 서비스 (측정·배포)
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8888
          - eureka:8761
          - gateway:8080
          - user-service:8081
          - reservation-service:8082
          - payment-service:8083
          - mock-pg:8090
        labels:
          env: compose

  # IntelliJ로 띄운 서비스 (로컬 개발)
  - job_name: services-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8761
          - host.docker.internal:8080
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
          - host.docker.internal:8090
        labels:
          env: local
