# 지표 수집 (SA 9-1). Eureka에 등록된 앱은 자동으로 찾아서 수집한다.
# 새 서비스(reservation, payment, mock-pg)가 Eureka에 등록되면 이 파일을 고치지 않아도 수집된다
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: eureka-apps
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://eureka:8761/eureka
        refresh_interval: 15s

  # Eureka에 등록하지 않는 기반 서버
  - job_name: platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['config-server:8888', 'eureka:8761']
