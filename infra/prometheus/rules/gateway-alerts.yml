# Gateway 알림 규칙(ADR 0050). 기준값은 [가정]이며 부하 측정에 맞춰 조정한다.
# - urgency=threshold: 서비스는 돌지만 자기 과부하로 일부 요청을 거절하는 상태
#
# Note: auth-redis 차단기는 bulkhead 거절을 실패로 세지 않는다(ignoreExceptions). 그래서 Gateway가 넘친 인증 요청을 503으로 거절해도
# 차단기 상태로는 보이지 않는다. 거절은 이 규칙이 따로 본다. 분모는 차단기를 지난 auth-redis 호출 전체(성공·실패·무시)다.
groups:
  - name: gateway-threshold
    rules:
      - alert: GatewayAuthRedisBulkheadRejecting
        expr: >-
          sum by (application) (rate(gateway_auth_redis_failures_total{application="gateway",cause="bulkhead_full"}[5m]))
          / sum by (application) (rate(resilience4j_circuitbreaker_calls_seconds_count{application="gateway",name="auth-redis"}[5m]))
          > 0.01
        for: 5m
        labels: {service: gateway, urgency: threshold, severity: warning}
        annotations:
          summary: "Gateway가 인증 요청의 1% 넘게 bulkhead로 거절하고 있습니다(5분 평균). Redis 장애가 아니라 Gateway 과부하입니다."
          runbook: "docs/decisions/0050-gateway-auth-redis-breaker-bulkhead-split.md 결과"
