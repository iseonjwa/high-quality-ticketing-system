# 같은 장비의 배경 CPU(측정 대상이 아닌 일)를 배포 서버 측정 모드에서만 줄이는 덮어쓰기다(ISE-264 실험 X2).
# 운영 설정(compose.yml, config-repo)은 바꾸지 않는다. 값을 안 주면 운영과 같다.
#   KAFKA_HEALTH_INTERVAL=60s REQUEST_LOG_ENABLED=false MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.background-cpu.yml
# 한 번에 하나씩 비교할 때는 바꿀 변수 하나만 준다. 주지 않은 변수는 운영값이다.
#   KAFKA_HEALTH_INTERVAL=60s MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.background-cpu.yml
#   REQUEST_LOG_ENABLED=false MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.background-cpu.yml
#   비교 기준(대조) 실행도 이 파일을 변수 없이 얹어 켠다. 아래처럼 파일을 얹기만 해도 두 서비스가 다시 만들어지므로,
#   파일 없이 켠 실행과 비교하면 재기동 여부가 함께 달라진다.
# 다른 덮어쓰기와 함께 쓸 때는 파일을 같이 준다(measure-mode.sh on은 인자로 준 파일을 모두 얹는다).
#   RES_POOL_MAX=10 KAFKA_HEALTH_INTERVAL=60s MEASURER=<영문 이름> script/loadtest/measure-mode.sh on \
#     loadtest/deploy/compose.reservation-pool.yml loadtest/deploy/compose.background-cpu.yml
# 괄호 안이 기본값(= 운영)이다. 운영 값을 바꾸면 아래 기본값도 같이 바꾼다.
#   KAFKA_HEALTH_INTERVAL(30s, compose.yml kafka healthcheck) REQUEST_LOG_ENABLED(true, config-repo/application.yml)
# 기본값이면 동작은 운영과 같지만, reservation·payment에는 환경변수가 하나 늘어 이 파일을 얹는 것만으로 두 서비스가 다시 만들어진다.
#
# 왜: 배포 서버는 4 vCPU 한 대에 모든 컨테이너가 있어, 측정 대상이 아닌 일도 같은 CPU를 쓴다.
# - (11/16 이전) kafka healthcheck는 10초마다 kafka-broker-api-versions.sh를 실행했고, 이 스크립트는 실행할 때마다 JVM을 새로 띄웠다.
#   11/15 배포 서버 조사에서 한 번에 1.80~3.76초 걸렸다. ISE-264에서 운영 검사를 JVM 없는 ApiVersions 요청(bash /dev/tcp)과
#   30초 간격으로 바꿨다(TS-70). 이제 이 변수는 간격만 더 늘렸을 때의 차이를 본다.
# - reservation-service·payment-service는 2026-11-16 전까지 정상 요청까지 요청마다 로그 한 줄을 남겼다. ADR 0052 2단계(ISE-286)
#   뒤로는 Gateway처럼 문제 요청만 남기므로, 이 끄기는 남은 문제 요청 줄까지 없앤 차이만 본다.
# 이 둘을 줄였을 때 측정값이 얼마나 바뀌는지 본다.
#
# Note: kafka healthcheck는 interval만 바꾼다. compose는 healthcheck를 키별로 합치므로 test·timeout·retries·start_period·start_interval은 compose.yml 값이 남는다.
# interval을 바꾸면 kafka 컨테이너가 다시 만들어진다(Kafka 재시작). on·off 때마다 Kafka가 다시 뜨고, 소비자들이 다시 붙는다.
# 재시작 직후의 몇 분은 측정에서 뺀다. 측정 전에 docker inspect --format '{{.State.Health.Status}}' <kafka 컨테이너>가 healthy인지 확인한다.
# Note: 기동 직후 start_period(120초) 동안은 start_interval(2초)마다 검사하므로 interval을 늘려도 첫 healthy 판정은 늦어지지 않는다.
# 다만 기동이 120초를 넘기면 그 뒤 검사는 interval마다라 판정이 그만큼 늦다. measure-mode.sh on은 up -d --wait --wait-timeout 420이라 kafka가 healthy가 될 때까지 기다리고,
# 420초 안이면 실패하지 않는다(interval을 수 분 이상으로 두지 않는다). depends_on: condition: service_healthy로 kafka를 기다리는
# 서비스(reservation·payment·kafka-ui 등)는 새로 만들어질 때 이 조건을 본다. 설정이 같아 다시 만들어지지 않는 서비스는
# 떠 있는 채로 Kafka에 다시 연결할 것으로 본다(추정, 배포 서버에서 확인 못 함).
# Note: REQUEST_LOG_ENABLED=false는 요청 로그 필터를 아예 등록하지 않는다(CommonWebConfiguration, @ConditionalOnProperty).
# "문제 요청만 남기기"(iseonjwa.request-log.mode=problems)는 2단계부터 config-repo/application.yml의 운영 기본값이다(ADR 0052).
# 변수 이름 ISEONJWA_REQUESTLOG_ENABLED는 Spring Boot 환경변수 규칙(점은 _, 하이픈은 지움)을 따른다.
# 환경변수는 config 서버에서 받은 설정보다 우선이다(compose.reservation-pool.yml 머리말과 같다).
#
# 적용 확인
# - healthcheck: docker inspect --format '{{.Config.Healthcheck.Interval}}' <kafka 컨테이너>가 준 값인지 본다(나노초로 나온다. 60s = 60000000000).
# - 요청 로그: 켜기 전후로 같은 시간(예: 1분) 동안 docker logs --since 1m <reservation-service 컨테이너> | grep -c '요청 '를 비교한다.
#   false면 "요청 GET /api/..." 줄이 0이어야 한다.
services:
  kafka:
    healthcheck:
      interval: ${KAFKA_HEALTH_INTERVAL:-30s}
  reservation-service:
    environment:
      ISEONJWA_REQUESTLOG_ENABLED: ${REQUEST_LOG_ENABLED:-true}
  payment-service:
    environment:
      ISEONJWA_REQUESTLOG_ENABLED: ${REQUEST_LOG_ENABLED:-true}
