# Gateway auth-redis 호출의 동시 실행 제한(bulkhead)과 차단기 기준(느린 호출·창·실패율·열림 시간 등)을 바꿔 배포 서버에서 잴 때만 쓰는 덮어쓰기다(ISE-229).
# 운영 설정(config-repo)은 바꾸지 않는다. 측정자가 measure-mode.sh on 의 인자로 준다. 값을 안 주면 지금과 같다(동시 25, 켬, 느린 호출 50ms).
#   AUTH_BULKHEAD=200 MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.gateway-bulkhead.yml
#   AUTH_BULKHEAD_ENABLED=false MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.gateway-bulkhead.yml
#   AUTH_SLOW_CALL=100ms MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.gateway-bulkhead.yml
# 차단기 기준도 바꿀 수 있다. 값을 안 주면 config-repo/gateway.yml의 auth-redis 값과 같다.
#   AUTH_WINDOW_TYPE(COUNT_BASED) AUTH_WINDOW_SIZE(20) AUTH_MIN_CALLS(20) AUTH_FAILURE_RATE(50)
#   AUTH_SLOW_RATE(50) AUTH_OPEN_WAIT(10s) AUTH_HALF_OPEN(5)
#   TIME_BASED에서 AUTH_WINDOW_SIZE는 호출 수가 아니라 초다.
# 11/10 측정 E 값(시간 창 10초, 최소 500건, 느린 호출 100ms·80%, 열림 5초, bulkhead 100):
#   AUTH_WINDOW_TYPE=TIME_BASED AUTH_WINDOW_SIZE=10 AUTH_MIN_CALLS=500 AUTH_FAILURE_RATE=50 AUTH_SLOW_RATE=80 AUTH_OPEN_WAIT=5s AUTH_HALF_OPEN=20 AUTH_SLOW_CALL=100ms AUTH_BULKHEAD=100 MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.gateway-bulkhead.yml
# 열림 시간 비교(나머지는 그대로 두고 AUTH_OPEN_WAIT만 바꿔 두 번 잰다):
#   AUTH_OPEN_WAIT=10s MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.gateway-bulkhead.yml
#   AUTH_OPEN_WAIT=5s MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.gateway-bulkhead.yml
# 여러 값을 함께 줄 수 있지만, 비교할 때는 한 번에 하나만 바꾼다(E 값처럼 묶음 하나를 기준과 비교할 때는 예외).
# measure-mode.sh on은 인자로 준 파일만 얹으므로, 이 파일 없이 on 하거나 off 하면 gateway가 기본값으로 돌아온다.
# 값을 바꿔 다시 on 하면 gateway만 다시 만들어진다. 재시작 직후 Gateway는 식어 있으니 워밍업 뒤에 잰다.
#
# 왜: 2026-11-09 배포 Q1 측정(ISE-202)에서 auth-redis 차단기가 대기열보다 먼저 열렸다.
# - 데운 상태 초당 약 2,000~3,000명: 2ms 안의 빠른 실패로 열렸다. bulkhead 기본값(동시 25, 대기 0) 거절로 보이지만,
#   25를 100으로 올려도 한도가 같아 확정하지 못했다(ISE-230).
# - 재기동 직후 초당 300~1,000명: 느린 호출(50ms 초과, 최대 약 80ms)로 열렸다. Redis 자체는 0.1~0.8ms였다.
#   AUTH_SLOW_CALL로 기준을 늘려 이 경우에 차단기가 버티는지 본다.
#
# Note: auth-redis처럼 이름에 하이픈이 있는 키는 환경변수 완화 바인딩으로 넣기 어려워 SPRING_APPLICATION_JSON으로 넣는다.
# SPRING_APPLICATION_JSON은 config 서버에서 받은 gateway.yml(spring.config.import)보다 우선이라, config-repo에 있는
# slow-call-duration-threshold도 덮어쓴다(강민 확인, 2026-11-10).
# 적용 확인: bulkhead 값은 켠 뒤 Grafana에서 resilience4j_bulkhead_max_allowed_concurrent_calls{name="auth-redis"}가
# 준 값인지 먼저 보고, 아니면 재지 않는다. 끄는 설정(AUTH_BULKHEAD_ENABLED=false)이어도 이 파일이
# instances.auth-redis.maxConcurrentCalls를 함께 넣으므로 bulkhead 지표(max_allowed)는 남을 수 있다. 꺼졌는지는
# 몰림 구간에서 resilience4j_bulkhead_available_concurrent_calls{name="auth-redis"}가 줄지 않는지로 본다
# (추정, ISE-230 gw-obs 컨텍스트 테스트로 확인 예정). 느린 호출 기준과 차단기 기준은 값을 보여 주는 지표가 없어,
# 차단기가 열리는 시점·상태 전환으로 간접 확인한다. JSON 안 숫자 자리(AUTH_WINDOW_SIZE 등)에 따옴표나 단위를 넣으면
# gateway가 뜨지 않으니 숫자만 준다.
services:
  gateway:
    environment:
      SPRING_APPLICATION_JSON: '{"resilience4j":{"bulkhead":{"instances":{"auth-redis":{"maxConcurrentCalls":${AUTH_BULKHEAD:-25}}}},"circuitbreaker":{"instances":{"auth-redis":{"slowCallDurationThreshold":"${AUTH_SLOW_CALL:-50ms}","slidingWindowType":"${AUTH_WINDOW_TYPE:-COUNT_BASED}","slidingWindowSize":${AUTH_WINDOW_SIZE:-20},"minimumNumberOfCalls":${AUTH_MIN_CALLS:-20},"failureRateThreshold":${AUTH_FAILURE_RATE:-50},"slowCallRateThreshold":${AUTH_SLOW_RATE:-50},"waitDurationInOpenState":"${AUTH_OPEN_WAIT:-10s}","permittedNumberOfCallsInHalfOpenState":${AUTH_HALF_OPEN:-5}}}}},"spring":{"cloud":{"circuitbreaker":{"bulkhead":{"resilience4j":{"enabled":${AUTH_BULKHEAD_ENABLED:-true}}}}}}}'
