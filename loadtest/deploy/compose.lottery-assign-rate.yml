# 추첨 배정 워커의 주기당 배정 상한을 배포 서버 측정 모드에서만 바꾸는 덮어쓰기다(ISE-94 시나리오 3 재측정용).
# 운영 설정(config-repo/reservation-service.yml)은 바꾸지 않는다. 값을 안 주면 운영 설정(10)과 같다.
#   LOTTERY_ASSIGN_PER_CYCLE=100 MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.lottery-assign-rate.yml
# 괄호 안이 기본값(= config-repo/reservation-service.yml)이다. 운영 값을 바꾸면 아래 기본값도 같이 바꾼다.
#   LOTTERY_ASSIGN_PER_CYCLE(10)
# 100이면 상한을 두기 전(주기당 시도 100건)과 같다. 같은 날 10과 100을 번갈아 재서 비교한다.
# measure-mode.sh on은 인자로 준 파일만 얹으므로, 이 파일 없이 on 하거나 off 하면 reservation-service가 운영 값으로 돌아온다.
#
# 적용 확인: 추첨 뒤 increase(lottery_assignment_results_total{result="assigned"}[1m]) ÷ 60이 초당 상한 근처(10이면 약 8~9)인지 본다.
#
# Note: 이름은 Spring Boot 환경변수 완화 바인딩 규칙(점은 _, 하이픈은 지움, 대문자)을 따른다. assign-per-cycle → ASSIGNPERCYCLE.
# OS 환경변수가 config 서버 설정보다 우선인 근거는 compose.reservation-pool.yml 머리말에 있다.
services:
  reservation-service:
    environment:
      LOTTERY_SCHEDULER_ASSIGNPERCYCLE: ${LOTTERY_ASSIGN_PER_CYCLE:-10}
