# 배포 서버 측정 모드 전용 덮어쓰기다(ISE-191, docs/design/infra/load-test.md 5절). 직접 쓰지 않고 측정 날 서버에서
# script/loadtest/measure-mode.sh on 이 아래처럼 compose.yml, compose.deploy.yml 위에 얹는다.
#   docker compose --env-file .env --env-file .env.measure -f compose.yml -f compose.deploy.yml -f loadtest/deploy/compose.measure.yml up -d --wait
# 끝나면 measure-mode.sh off 로 이 파일 없이 다시 띄운다. 운영 키와 샘플링 1.0, 닫힌 9090으로 돌아온다.
#
# 이 파일이 바꾸는 것
# - Prometheus가 k6 결과를 remote write로 받는다(--web.enable-remote-write-receiver). 9090을 호스트에 열고, 보안 그룹이
#   발생기 보안 그룹에서 오는 9090만 허용한다(규칙은 콘솔에서 사람이 넣는다). 열린 동안 Prometheus UI도 같은 보안 그룹에 보인다.
# - 추적 샘플링을 1.0에서 0.01로 낮춘다(TRACING_SAMPLE_RATE). 전부 추적하면 부하 때 추적 비용이 결과를 가린다(open-peak-load-plan.md 1-3절).
# - 서명 키(JWT_ACCESS_SECRET, ENTRY_TOKEN_SECRET)는 이 파일이 아니라 .env.measure가 바꾼다. compose.yml이 ${...}로 읽기 때문이다.
#
# Note: compose.yml의 prometheus에는 command가 없어 이미지 기본 인자(CMD)가 쓰인다. command를 정하면 기본 인자가 사라지므로
# 이미지 기본값(--config.file, --storage.tsdb.path)을 그대로 다시 적고 플래그만 더한다. 이미지(digest)를 올리면 CMD를 다시 확인한다.
# Note: 샘플링은 compose.deploy.yml이 TRACING_SAMPLE_RATE를 정하는 서비스 5개(eureka, gateway, user-service, reservation-service,
# payment-service)에만 덮는다. config-server와 mock-pg는 원래 값이 없다.
services:
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports: !override ["9090:9090"]
  eureka:
    environment:
      TRACING_SAMPLE_RATE: "0.01"
  gateway:
    environment:
      TRACING_SAMPLE_RATE: "0.01"
  user-service:
    environment:
      TRACING_SAMPLE_RATE: "0.01"
  reservation-service:
    environment:
      TRACING_SAMPLE_RATE: "0.01"
  payment-service:
    environment:
      TRACING_SAMPLE_RATE: "0.01"
