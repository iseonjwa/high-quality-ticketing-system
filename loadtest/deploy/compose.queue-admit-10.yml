# O1 Synthetic 대기 이탈 추가 실행 전용 덮어쓰기다. reservation-service의 입장 속도(queue.admit-per-second)를 50에서 10으로 낮춘다.
#   MEASURER=<영문 이름> script/loadtest/measure-mode.sh on loadtest/deploy/compose.queue-admit-10.yml
# 끝나면 이 파일 없이 on 하거나 off 해서 50으로 돌아온다. 운영 설정(config-repo/reservation-service.yml)은 바꾸지 않는다.
# 절차와 볼 지표: loadtest/k6/README.md "O1 입장 속도 10/s 추가 실행". 이 실행은 synthetic-data.md 5-0절 판정 실행과 분리한다.
#
# 왜: 3,000명·50/s에서는 최대 대기가 약 44초라 queue_patience_s(대기 인내)가 한 명도 걸리지 않는다(CSV 모의 계산 이탈 0명).
# 10/s면 최대 대기 약 236초, 이탈 약 137명으로 계산된다. 인내 시간을 고치지 않고 조건만 바꿔
# "취소 API가 없어 떠난 사람의 입장 자리가 버려지는 대가"를 숫자로 본다(docs/ai-judgments/kangmin/2026-11-13-o1-scenario-review-four-proposals.md).
#
# Note: 환경변수 이름은 Spring 완화 바인딩 규칙으로 점을 밑줄로 바꾸고 하이픈을 빼 대문자로 쓴다(queue.admit-per-second → QUEUE_ADMITPERSECOND).
# config 서버에서 받은 값(spring.config.import)은 일반 config data로 들어가 OS 환경변수보다 우선순위가 낮다. 같은 방식인
# compose.queue-hold.yml의 QUEUE_ADMISSIONENABLED가 배포 서버 Q2에서 config-repo의 admission-enabled: true를 이겼다
# (q2-queue-poll.js setup의 입장 스케줄러 꺼짐 확인 통과). admit-per-second를 이 방식으로 덮은 적은 아직 없으므로 켠 뒤 적용을 먼저 확인한다.
# 입장 속도 10이면 서버가 주는 예상 대기(estimatedWaitSeconds = 순번 ÷ 10)와 폴링 간격(3~10초)도 같이 바뀐다.
services:
  reservation-service:
    environment:
      QUEUE_ADMITPERSECOND: "10"
