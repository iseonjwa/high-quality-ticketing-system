spring:
  application:
    name: mock-pg
  profiles:
    default: local
  # 장애 주입 DELAY(최대 60초)가 플랫폼 스레드(Tomcat 기본 200)를 붙잡아, loadtest에서 지연이 걸리지 않은 요청과
  # 장애 해제 요청까지 막는 것을 막는다. 지연은 원장 잠금(compute) 밖에서 자므로 캐리어 고정이 없다
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # 오타 필드(예: orderID)를 조용히 무시하면 주문 한정 규칙이 전역 규칙이 되어 배경 호출이 횟수를 가져간다
      fail-on-unknown-properties: true
mock-pg:
  billing:
    # 빌링키 서명 키. Mock PG는 빌링키를 저장하지 않고 서명으로 확인하므로, 다시 띄워도 같은 값이어야 발급한 키가 유효하다(ISE-235).
    # 가짜 카드의 빌링키만 지키는 값이라 기본값을 둔다. 바꾸면 그 전에 발급한 빌링키는 모두 거절된다
    signing-secret: ${MOCK_PG_BILLING_SIGNING_SECRET:mock-pg-billing-key-signing-default}
---
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}?fail-fast=true&max-attempts=6&initial-interval=1000&max-interval=5000&multiplier=1.5"
