# 이름과 Config 서버 주소만 둔다. 포트는 config-repo/mock-pg.yml에 있다 (SA 9-6)
spring:
  application:
    name: mock-pg
  cloud:
    config:
      # 설정을 못 받으면 기본값으로 뜨지 않고 기동을 멈춘다
      fail-fast: true

---
# 테스트가 아닐 때만 Config 서버에서 설정을 받는다.
# import를 기본 문서에 두면 test 프로필 문서의 enabled: false보다 먼저 처리돼 테스트도 접속을 시도한다 (TS-5)
spring:
  config:
    activate:
      on-profile: "!test"
    # 컨테이너에서는 CONFIG_SERVER_URL=http://config-server:8888, IntelliJ에서는 기본값 localhost
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}

---
# 테스트는 Config 서버·Eureka·Zipkin 없이 돈다.
spring:
  config:
    activate:
      on-profile: test
  cloud:
    config:
      enabled: false
eureka:
  client:
    enabled: false
management:
  tracing:
    export:
      zipkin:
        enabled: false
