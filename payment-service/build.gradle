dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'
    implementation project(':common')
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // Note: 버전은 spring-cloud-dependencies BOM이 관리한다. 애노테이션 AOP는 "TX1 앞에서 허가를 얻고 PG 호출 결과로
    // 정산"하는 흐름을 표현하지 못해 Spring 통합 모듈 없이 코어를 직접 쓴다
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
    implementation 'io.github.resilience4j:resilience4j-bulkhead'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
}

// Note: 결제 통합 테스트는 compose.test.yml의 PostgreSQL(payment_test)을 쓴다.
// ./gradlew build나 IDE의 Gradle 테스트 실행만으로도 테스트 인프라가 먼저 뜨게 한다(Docker 필요)
tasks.named('test') {
    dependsOn ':prepareTestInfra'
}
