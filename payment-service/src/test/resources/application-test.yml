server:
  address: 127.0.0.1
spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: ${TEST_PAYMENT_DB_URL:jdbc:postgresql://localhost:25434/payment_test}
    username: test
    password: test-only-password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    listener:
      auto-startup: false
management:
  tracing:
    export:
      zipkin:
        enabled: false
eureka:
  client:
    enabled: false
payment:
  outbox:
    # 테스트는 릴레이를 직접 호출한다. 스케줄러가 돌면 테스트 데이터를 먼저 집어 간다
    relay-enabled: false
  pg:
    provider: mock
    mock:
      base-url: http://127.0.0.1:8090
  token:
    # 테스트 전용 값이다. 형식은 운영 키와 같다(소문자 16진수 64자)
    secret: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
