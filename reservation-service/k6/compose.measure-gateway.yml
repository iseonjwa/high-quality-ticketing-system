# 단계 측정 기준 환경의 Gateway 덮어쓰기다. 측정 브랜치(experiment/ISE-79-k6-steps) 전용이다.
# Gateway 인증 차단기가 Gateway 자체 부하로 열리지 않게 한다(설정 값과 이유는 config-measure/gateway-k6measure.yml).
#
# config-server는 공유 config-repo에 더해 측정 전용 폴더를 읽고, Gateway는 local에 k6measure 프로필을 더한다.
# 프로필 파일(gateway-k6measure.yml)이 gateway.yml보다 우선하므로, 공유 설정 파일은 고치지 않는다.
# Note: step-run.sh는 reservation-service만 다시 띄운다. 이 파일을 바꾸면 config-server와 gateway를 다시 띄운다.
services:
  config-server:
    environment:
      CONFIG_REPO_PATH: file:/config-repo,file:/config-measure
    volumes: ["./reservation-service/k6/config-measure:/config-measure:ro"]
  gateway:
    environment:
      SPRING_PROFILES_ACTIVE: local,k6measure
  # 측정 당시 스택에 없던 서비스다(dev ISE-126에서 생김). 측정 기준 환경에서는 띄우지 않아 CPU·메모리를 측정 때와 같게 둔다.
  # 프로필을 붙이면 up이 이 서비스를 건너뛴다. 띄우려면 --profile k6-off를 준다
  assistant-service:
    profiles: ["k6-off"]
