# SCALE=2 이상 전용 덮어쓰기다. reservation-service의 고정 호스트 포트(8082, 18082)를 지운다.
# 같은 호스트 포트를 여러 컨테이너가 쓸 수 없다. Gateway는 Eureka로 인스턴스를 찾으므로 호스트 포트가 없어도 된다.
# Note: Prometheus는 reservation-service:9080 하나를 긁어 여러 대 중 한 대의 지표만 본다. 여러 대 회는 DB 쪽 값과 인스턴스 로그로 판정한다
services:
  reservation-service:
    ports: !reset []
