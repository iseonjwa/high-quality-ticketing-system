# 단계 측정 기준 환경의 관찰 덮어쓰기다. 측정 브랜치(experiment/ISE-79-k6-steps) 전용이다.
# compose.deploy-memory.yml 위에 얹어 메모리 값은 그대로 두고 GC 로그만 켠다. GC 종류는 JVM이 고르게 둔다(배포와 같다).
#
# Note: JAVA_TOOL_OPTIONS는 덮어쓰기에서 통째로 바뀐다. 그래서 메모리 값을 다시 적는다. 값은 compose.deploy-memory.yml과 같아야 한다.
# Note: 컨테이너 메모리 1,152MB에서는 JVM이 Serial GC를 고른다. G1은 이 파일이 아니라 단계(compose.g1.yml)로 켠다.
services:
  reservation-service:
    environment:
      JAVA_TOOL_OPTIONS: -Xms384m -Xmx768m -Xlog:gc,gc+heap=info:file=/tmp/gc.log:uptime
