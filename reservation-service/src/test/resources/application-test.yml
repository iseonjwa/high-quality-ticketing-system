server:
  address: 127.0.0.1
spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: ${TEST_RESERVATION_DB_URL:jdbc:postgresql://localhost:25435/reservation_test}
    username: test
    password: test-only-password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: ${TEST_REDIS_PORT:26379}
      timeout: 1s
  kafka:
    producer:
      properties:
        # config-repo/reservation-service.yml과 같다. 릴레이 전송 시한(12초) 안에 들어와야 기동한다
        delivery.timeout.ms: 10000
        max.block.ms: 2000
    listener:
      auto-startup: false
management:
  tracing:
    export:
      zipkin:
        enabled: false
eureka:
  client:
    enabled: false
queue:
  admit-per-second: 50
  entry-token-ttl: 10m
  poll-min: 3s
  poll-max: 10s
  poll-jitter-ratio: 0.2
  admission-enabled: false
  admission-interval: 500ms
  cleanup-limit: 500
  schedule-cache-refresh: 30s
  schedule-cache-look-ahead: 1h
  key-retention-after-start: 1h
entry-token:
  # 테스트 전용 값이다. 결제 토큰 키와 다르게 둔다
  secret: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100
messaging:
  outbox:
    # 테스트는 outbox 행만 확인한다. 릴레이가 돌면 테스트 데이터를 먼저 집어 간다
    relay-enabled: false
seathold:
  expiry:
    # 테스트는 스케줄러 메서드를 직접 호출한다. 백그라운드 주기가 테스트 데이터를 먼저 바꾸지 않게 끈다
    enabled: false
payment:
  token:
    # 테스트 전용 값이다. 형식은 운영 키와 같다(소문자 16진수 64자)
    secret: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
# 추첨 스케줄러는 끈다. 테스트는 서비스를 직접 불러 시각과 데이터를 정한다
lottery:
  scheduler:
    enabled: false
