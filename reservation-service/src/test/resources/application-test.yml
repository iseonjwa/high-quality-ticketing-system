server:
  address: 127.0.0.1
spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: ${TEST_RESERVATION_DB_URL:jdbc:postgresql://localhost:25435/reservation_test}
    username: test
    password: test-only-password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: ${TEST_REDIS_PORT:26379}
      timeout: 1s
  kafka:
    listener:
      auto-startup: false
management:
  tracing:
    export:
      zipkin:
        enabled: false
eureka:
  client:
    enabled: false
queue:
  admit-per-second: 50
  entry-token-ttl: 10m
  poll-min: 3s
  poll-max: 10s
  poll-jitter-ratio: 0.2
payment:
  token:
    # 테스트 전용 값이다. 형식은 운영 키와 같다(소문자 16진수 64자)
    secret: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
